<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ink harness · Screwball Slugger</title>
<!-- BB.Ink QA (tools/ink-shots.js). Same URL states as tools/render-harness.html, plus:
       fx=0|1          ink pass off / on (default on)            hulls=0|1   keep the inverted hulls under the ink
       q=1|2|3         quality low / medium / high                dbg=normals|edges|nib|lines   intermediate targets
       mark=0          don't put the procedural cast on layer 1 (the harness does it until 32-cast.js does)
       skin=1          add a skinned + morph-target test limb next to Rocco (checks the normals pass deforms)
       glb=1           add assets/rocco.glb (if present) at the test spot, posed with clip=<name>&ct=<seconds>
       cam=rocco|pitcher|catcher|test   a close-up camera on that character (render only; not the game camera)
-->
<style>
@font-face { font-family: 'Luckiest Guy'; src: url(../qa/render/fonts/LuckiestGuy.woff2) format('woff2'); }
@font-face { font-family: 'Fredoka'; font-weight: 300 700; src: url(../qa/render/fonts/Fredoka.woff2) format('woff2'); }
html, body { margin: 0; background: #FFF4DC; overflow: hidden; }
canvas#game { display: block; position: fixed; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="../src/vendor/three.min.js"></script>
<script src="../src/vendor/three-addons.js"></script>
<script>window.BB_RENDER_HQ = true;</script>
<script src="../src/00-const.js"></script>
<script>
var Q = {};
function qs(str) { var o = {}; (str || '').replace(/^\?/, '').split('&').forEach(function (kv) { if (!kv) return; var p = kv.split('='); o[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); }); return o; }
Q = qs(location.search);
// optional: the glb, inlined the way tools/build.js does it, before the modules boot
function loadGlb(done) {
  var x = new XMLHttpRequest(); x.open('GET', '../assets/rocco.glb'); x.responseType = 'arraybuffer';
  x.onload = function () {
    if (x.response && x.response.byteLength > 100) {
      var b = new Uint8Array(x.response), s = '', CH = 0x8000;
      for (var i = 0; i < b.length; i += CH) s += String.fromCharCode.apply(null, b.subarray(i, i + CH));
      window.BB_ASSETS = { rocco: btoa(s) }; window.__glb = x.response;
    }
    done();
  };
  x.onerror = function () { done(); };
  try { x.send(); } catch (e) { done(); }
}
var MODS = ['10-pitch.js', '15-bat.js', '20-content.js', '31-toon.js', '32-cast.js', '33-park.js', '34-anim.js', '35-scene.js', '36-rocco.js', '37-ink.js', '38-cards.js'];
function loadMods(i) {
  if (i >= MODS.length) return boot();
  var s = document.createElement('script'); s.src = '../src/' + MODS[i];
  s.onload = s.onerror = function () { loadMods(i + 1); };
  document.head.appendChild(s);
}
loadGlb(function () { loadMods(0); });

// ---------------------------------------------------------------- mocks (same as tools/render-harness.html)
var MOCK_PARK = {
  id: 'p_mock', name: 'Mock Meadow', town: 'Mockton', inkset: 'classic',
  fence: [[-45, 330, 10], [-20, 370, 10], [0, 400, 12], [20, 370, 10], [45, 330, 10]],
  features: { scoreboard: true, lights: true, billboard: 'EAT AT JOE\'S · BEST PIE', water: 'right', hill: false, skyline: 'city' },
};
var MOCK_PITCHER = { id: 'p_mock', name: 'Mock McGee', hand: 'R', team: 'Mockers', velo: 90, arsenal: { FB: 0.6, SL: 0.4 }, control: 0.6, stuff: 0.6,
  look: { build: 'tall', hair: 'mustache', windup: 'classic', number: 27 } };
function parks() { return (BB.Content && BB.Content.PARKS && BB.Content.PARKS.length) ? BB.Content.PARKS : [MOCK_PARK]; }
function pitchers() { return (BB.Content && BB.Content.PITCHERS && BB.Content.PITCHERS.length) ? BB.Content.PITCHERS : [MOCK_PITCHER]; }
function mockPitch(pitcher, seed, type, strike) {
  if (BB.Pitch && BB.Pitch.make) {
    for (var k = 0; k < 600; k++) {
      var p = BB.Pitch.make(pitcher, { balls: 0, strikes: 0, derby: true, id: 1 }, BB.U.rng(seed + k));
      if ((!type || p.type === type) && (strike == null || p.strike === strike)) return p;
    }
  }
  var T = 0.72;
  return { id: 0, type: 'FB', name: 'Fastball', mph: 94, T: T, release: { x: -1.75, y: 54.5, z: 6 }, plate: { x: 0.2, z: 2.6 }, strike: true,
    pos: function (t) { var s = t / T; if (s > 1) return { x: 0.2, y: -3 * Math.min(1, (s - 1) * 4), z: 2.5 }; return { x: -1.75 + 1.95 * s, y: 54.5 * (1 - s), z: 6 - 3.4 * s + 0.6 * 4 * s * (1 - s) }; } };
}
function mockPlay(park, want) {
  var sw = want === 'hr' ? { contact: true, label: 'PERFECT', quality: 1, sweet: true, ev: 110, la: 29, spray: -14, power: true }
    : want === 'gap' ? { contact: true, label: 'GREAT', quality: 0.8, sweet: false, ev: 101, la: 17, spray: 24, power: false }
    : want === 'wall' ? { contact: true, label: 'GREAT', quality: 0.85, sweet: false, ev: 104, la: 22, spray: -2, power: false }
    : want === 'fly' ? { contact: true, label: 'GOOD', quality: 0.6, sweet: false, ev: 92, la: 34, spray: 8, power: false }
    : want === 'foul' ? { contact: true, label: 'LATE', quality: 0.3, sweet: false, ev: 80, la: 30, spray: 58, power: false }
    : { contact: true, label: 'EARLY', quality: 0.4, sweet: false, ev: 84, la: -6, spray: -18, power: false };
  var match = { hr: function (p) { return p.type === 'HR'; }, gap: function (p) { return p.type === '2B' || p.type === '3B'; },
    wall: function (p) { return p.wall && p.type !== 'HR'; }, ground: function (p) { return p.type === 'OUT' && p.outKind === 'ground'; },
    fly: function (p) { return p.type === 'OUT' && p.outKind === 'fly'; }, foul: function (p) { return p.type === 'FOUL'; } }[want] || function () { return true; };
  if (BB.Bat && BB.Bat.play) {
    for (var k = 0; k < 400; k++) {
      var s2 = Object.assign({}, sw, { ev: sw.ev + (k % 7) - 3, la: sw.la + ((k * 3) % 9) - 4, spray: sw.spray + ((k * 5) % 11) - 5 });
      var pl = BB.Bat.play(s2, park, BB.U.rng(1000 + k), { bases: [true, false, false], outs: 1 });
      if (match(pl)) { pl._sw = s2; return pl; }
    }
  }
  var d = want === 'hr' ? 420 : want === 'gap' ? 330 : 120, sp = BB.U.rad(sw.spray), apex = want === 'hr' ? 95 : want === 'gap' ? 40 : 3, hang = want === 'ground' ? 1.2 : 4;
  var dur = Math.max(2.2, hang + 0.8);
  return { type: want === 'hr' ? 'HR' : want === 'gap' ? '2B' : 'OUT', outKind: want === 'ground' ? 'ground' : null, dist: d, dur: dur, hang: hang, wall: false, catchBy: -1, catchT: -1,
    ballAt: function (t) { var u = Math.min(1, t / hang); return { x: Math.sin(sp) * d * u, y: Math.cos(sp) * d * u, z: 3 + apex * 4 * u * (1 - u) }; },
    fielderAt: function (i, t) { var D = BB.Bat ? BB.Bat.FIELDERS[BB.Bat.ORDER[i]] : { x: 0, y: 100 }; return { x: D.x, y: D.y }; } };
}
function mockHud(o) {
  return Object.assign({ balls: 2, strikes: 1, outs: 1, outsMax: 3, bases: [true, false, true], inning: 'BOT 9', score: '3–4', goal: 'Bottom 9th. Down 1, runners on the corners, 1 out. Score 2 to win.', progress: '0 / 2 R', streak: 0 }, o || {});
}
function buildView(q) {
  var P = parks(), park = P[(+q.park || 0) % P.length], ps = pitchers();
  var pitcher = Object.assign({}, ps[(+q.pitcher || 0) % ps.length]);
  if (q.windstyle) pitcher.look = Object.assign({}, pitcher.look, { windup: q.windstyle });
  if (q.hand) pitcher.hand = q.hand;
  var bat = { id: 'b_hickory', name: 'Old Hickory' };
  BB.Render.setInks(q.ink && !/^(0|1|on|off|low|medium|high)$/.test(q.ink) ? q.ink : null);
  var v = { scene: q.scene || 'title', time: +(q.time || 3.2), park: park, pitcher: pitcher, bat: bat, windup: null, pitch: null, pitchT: null,
    swing: null, loading: null, assist: q.assist !== '0', play: null, playT: 0, runners: [], hud: q.nohud ? null : mockHud(q.hud ? JSON.parse(q.hud) : null),
    stamp: null, onFire: q.fire === '1', shake: +(q.shake || 0), hitstop: q.hitstop === '1', last: q.nolast ? null : { mph: 94, name: 'Slider' } };
  if (v.onFire && v.hud) v.hud.streak = 4;
  if (v.scene === 'bat') {
    var pitch = mockPitch(pitcher, +(q.seed || 7), q.ptype, q.strike != null ? q.strike === '1' : null);
    var st = q.state || 'idle';
    if (st === 'windup') v.windup = +(q.w || 0.5);
    if (st === 'loading') { v.windup = +(q.w || 0.85); v.loading = +(q.l || 1); }
    if (st === 'mid' || st === 'assist') { v.pitch = pitch; v.pitchT = pitch.T * +(q.f || 0.6); }
    if (st === 'swing' || st === 'contact' || st === 'whiff') {
      v.pitch = pitch;
      var sw = +(q.st || (st === 'swing' ? 0.035 : 0.12));
      v.pitchT = pitch.T - 0.07 + sw;
      var res = st === 'whiff' ? { contact: false, label: 'WHIFF', timingErr: -0.15 } : { contact: true, label: 'PERFECT', quality: 1, sweet: true, ev: 106, la: 26, spray: -8, timingErr: 0 };
      v.swing = { t: sw, result: res, power: !!q.power };
      if (st === 'contact') v.play = mockPlay(park, q.play || 'hr');
    }
    if (st === 'mitt' || st === 'called') { v.pitch = pitch; v.pitchT = pitch.T + +(q.dt || 0.08); }
  }
  if (v.scene === 'field') {
    var play = mockPlay(park, q.play || 'hr');
    v.play = play; v.playT = Math.min(play.dur, play.dur * +(q.f || 0.5));
    if (q.extra) v._extra = +q.extra;
    v.runners = q.play === 'gap' ? [{ from: 1, to: 4 }, { from: 0, to: 2 }] : q.play === 'ground' ? [{ from: 1, to: 2 }, { from: 0, to: -1 }] : q.play === 'hr' || !q.play ? [{ from: 1, to: 4 }, { from: 0, to: 4 }] : [];
  }
  if (q.stamp) v.stamp = { text: q.stamp, sub: q.sub || '', t: +(q.stt || 0.5), kind: q.kind || 'good' };
  return v;
}

// ---------------------------------------------------------------- ink test fixtures
var TEST = { skin: null, glb: null, mixer: null };
// the procedural cast goes on layer 1 here until 32-cast.js / 36-rocco.js do it themselves
function markCast() {
  var S = BB.Render._S;
  [S.rocco, S.pitcher, S.catcher, S.ump].concat(S.fielders || [], S.mates || []).forEach(function (c) { if (c && c.root) BB.Ink.mark(c.root); });
  if (S.bat) BB.Ink.mark(S.bat);
  if (S.ballG) BB.Ink.mark(S.ballG, { weight: 0.9 });
}
// a skinned, morph-targeted test limb: a fat tube on 3 bones, bent hard, with a "bulge" morph at 1
function makeSkinTest() {
  var H = 3.6, segs = 24, g = new THREE.CylinderGeometry(0.42, 0.3, H, 20, segs, false);
  g.translate(0, H / 2, 0);
  var pos = g.attributes.position, n = pos.count, si = [], sw = [], bulge = [];
  for (var i = 0; i < n; i++) {
    var y = pos.getY(i), u = y / H, b0 = Math.min(2, Math.floor(u * 3)), f = u * 3 - b0;
    // blend between neighbouring bones
    if (b0 < 2 && f > 0.5) { si.push(b0, b0 + 1, 0, 0); sw.push(1.5 - f, f - 0.5, 0, 0); } else { si.push(b0, 0, 0, 0); sw.push(1, 0, 0, 0); }
    var k = Math.exp(-Math.pow((u - 0.55) / 0.12, 2)) * 0.45;
    bulge.push(pos.getX(i) * k, 0, pos.getZ(i) * k);
  }
  g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4));
  g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));
  g.morphAttributes.position = [new THREE.Float32BufferAttribute(bulge, 3)];
  var bones = [new THREE.Bone(), new THREE.Bone(), new THREE.Bone()];
  bones[1].position.y = H / 3; bones[2].position.y = H / 3; bones[0].add(bones[1]); bones[1].add(bones[2]);
  var mat = new THREE.MeshToonMaterial({ color: '#E8C35A', gradientMap: BB.Toon.GRAD });
  var m = new THREE.SkinnedMesh(g, mat);
  m.add(bones[0]); m.bind(new THREE.Skeleton(bones));
  m.morphTargetInfluences = [1];
  bones[1].rotation.z = 0.9; bones[2].rotation.z = 0.9;
  var root = new THREE.Group(); root.add(m);
  root.rotation.x = Math.PI / 2; // Y-up model into the Z-up world
  BB.Toon.prep(g); // so a hull could be added; the ink pass doesn't need it
  m.frustumCulled = false;
  BB.Ink.mark(root);
  return root;
}
function addGlb(done) {
  if (!window.__glb || !THREE.GLTFLoader) return done(null);
  new THREE.GLTFLoader().parse(window.__glb, '', function (gltf) {
    var root = gltf.scene, wrap = new THREE.Group();
    root.traverse(function (o) {
      if (o.isMesh) {
        var c = o.material && o.material.color ? o.material.color : new THREE.Color('#ccc');
        var nm = new THREE.MeshToonMaterial({ color: c, gradientMap: BB.Toon.GRAD, side: o.material.side }); nm.name = o.material.name;
        o.material = nm;
        o.frustumCulled = false;
        if (o.morphTargetDictionary && Q.face) { var k = o.morphTargetDictionary[Q.face]; if (k != null) o.morphTargetInfluences[k] = 1; }
      }
    });
    wrap.add(root); wrap.rotation.x = Math.PI / 2;
    var outer = new THREE.Group(); outer.add(wrap);
    BB.Ink.mark(outer);
    TEST.mixer = new THREE.AnimationMixer(root);
    var clip = gltf.animations.filter(function (a) { return a.name === (Q.clip || 'stance'); })[0] || gltf.animations[0];
    if (clip) { TEST.mixer.clipAction(clip).play(); TEST.mixer.setTime(+(Q.ct || 0.3)); }
    TEST.clips = gltf.animations.map(function (a) { return a.name; });
    TEST.anims = gltf.animations;
    done(outer);
  }, function (e) { console.warn('glb parse failed', e); done(null); });
}

// ---------------------------------------------------------------- scenes
var canvas, last = null;
function boot() {
  canvas = document.getElementById('game');
  var w = +(Q.w || window.innerWidth), h = +(Q.h || window.innerHeight);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  BB.Render.init(canvas);
  BB.Render._S.noAdapt = true;
  BB.Render.resize(w, h, Math.min(window.devicePixelRatio || 1, 2));
  var fontsP = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load('20px "Luckiest Guy"'), document.fonts.load('700 12px "Fredoka"')]).catch(function () {}) : Promise.resolve();
  fontsP.then(function () {
    if (Q.glb === '1') addGlb(function (g) { TEST.glb = g; go(); }); else go();
  });
  function go() { window.setup = setup; setup(location.search); if (Q.anim) animate(); }
}
var CLOSE = new THREE.PerspectiveCamera(30, 1, 0.5, 2000); CLOSE.up.set(0, 0, 1);
function closeCam(which) {
  var S = BB.Render._S, tgt = null, d = 9, h = 0.5;
  if (which === 'rocco') tgt = (BB.Rocco && BB.Rocco.ready && BB.Rocco.ready() && BB.Rocco.R.root && BB.Rocco.R.root.visible) ? BB.Rocco.R.root : S.rocco && S.rocco.root;
  if (which === 'pitcher' && S.pitcher) { tgt = S.pitcher.root; d = 14; }
  if (which === 'catcher' && S.catcher) tgt = S.catcher.root;
  if (which === 'test') tgt = TEST.glb || TEST.skin;
  if (!tgt) return null;
  tgt.updateMatrixWorld(true);
  var b = new THREE.Box3().setFromObject(tgt), c = b.getCenter(new THREE.Vector3()), sz = b.getSize(new THREE.Vector3());
  d = Math.max(sz.z, sz.x * 1.2) * 2.6 + 2;
  var cam = S.cam, dir = new THREE.Vector3().subVectors(cam.position, c); dir.z = 0; dir.normalize();
  if (Q.front === '1' && which === 'test' && TEST.glb) { // look him in the face: the model's +Z (glTF front) in the world
    var inner = TEST.glb.children[0] && TEST.glb.children[0].children[0];
    if (inner) { inner.updateMatrixWorld(true); dir.set(0, 0, 1).transformDirection(inner.matrixWorld); dir.z = 0; dir.normalize(); }
    if (Q.zoom) { d = (+Q.zoom); }
  }
  if (Q.yaw) dir.applyAxisAngle(new THREE.Vector3(0, 0, 1), +Q.yaw * Math.PI / 180);
  CLOSE.aspect = S.W / S.H; CLOSE.fov = 30;
  if (Q.zoom && Q.front === '1') { c.z = b.max.z - sz.z * 0.2; } // head height
  CLOSE.position.copy(c).addScaledVector(dir, d); CLOSE.position.z = c.z + (Q.zoom ? 0.3 : sz.z * 0.15 + h);
  CLOSE.lookAt(c); CLOSE.updateProjectionMatrix(); CLOSE.updateMatrixWorld(true);
  return CLOSE;
}
function applyInk(q) {
  if (q.fx != null) BB.Ink.setEnabled(q.fx !== '0');   // (no fx: leave it to ?ink=)
  BB.Ink.setAuto(false);
  if (q.q) BB.Ink.setQuality(+q.q);
  BB.Ink.setHulls(q.hulls === '1');
  BB.Ink.debug(q.dbg || null);
}
function setup(search) {
  var q = qs(search); Q = q;
  applyInk(q);
  last = buildView(q);
  BB.Render._S.prevScene = ''; BB.Render._S.lastScene = '';
  var pre = Object.assign({}, last, { time: last.time - 1 });
  BB.Render.frame(pre);                       // builds the cast for this view
  if (q.mark !== '0') markCast();
  var S = BB.Render._S;
  if (q.skin === '1') {
    if (!TEST.skin) TEST.skin = makeSkinTest();
    if (TEST.skin.parent !== S.scene) S.scene.add(TEST.skin);
    TEST.skin.position.set(+(q.tx || 1.6), +(q.ty || 1.2), 0);
  } else if (TEST.skin && TEST.skin.parent) TEST.skin.parent.remove(TEST.skin);
  if (TEST.glb && q.glb !== '1' && TEST.glb.parent) TEST.glb.parent.remove(TEST.glb); // only when the shot asks for it
  if (TEST.glb && q.glb === '1') {
    if (TEST.glb.parent !== S.scene) S.scene.add(TEST.glb);
    if (TEST.mixer && TEST.anims) {   // pose: clip + time
      TEST.mixer.stopAllAction();
      var clip = TEST.anims.filter(function (a) { return a.name === (q.clip || 'stance'); })[0] || TEST.anims[0];
      if (clip) { TEST.mixer.clipAction(clip).reset().play(); TEST.mixer.setTime(+(q.ct || 0.3)); }
    }
    TEST.glb.traverse(function (o) {
      if (o.morphTargetDictionary) for (var k in o.morphTargetDictionary) o.morphTargetInfluences[o.morphTargetDictionary[k]] = k === q.face ? 1 : 0;
    });
    if (q.glbspot === 'game') { // where the game puts him (docs: root rotated z = PI/2 at (-2.4, 0, 0)); the procedural Rocco steps out
      TEST.glb.position.set(-2.4, 0, 0); TEST.glb.rotation.set(0, 0, Math.PI / 2);
      if (S.rocco) S.rocco.root.traverse(function (o) { o.layers.disableAll(); });
    } else {
      TEST.glb.position.set(+(q.tx || 1.8), +(q.ty || 1.0), 0); TEST.glb.rotation.set(0, 0, +(q.tyaw || -150) * Math.PI / 180);
    }
  }
  BB.Render.frame(last);
  if (q.cam) {
    var c = closeCam(q.cam);
    if (!c) throw new Error('no close-up target: ' + q.cam);
    if (BB.Ink.active()) BB.Ink.render(S.renderer, S.scene, c, { scene: last.scene, time: last.time, hitstop: false });
    else S.renderer.render(S.scene, c);
    S.octx.setTransform(1, 0, 0, 1, 0, 0); S.octx.clearRect(0, 0, S.ov.width, S.ov.height);
  }
  window.__done = true;
  return BB.Ink.stats();
}
function animate() {
  var t0 = performance.now(), q = Q, v = buildView(q), pitch = v.pitch || mockPitch(v.pitcher, 7);
  var loop = function () {
    var t = (performance.now() - t0) / 1000;
    v.time = t;
    if (v.scene === 'bat' && q.anim === 'cycle') {
      var c = t % 3.2;
      if (c < 1.15) { v.windup = c / 1.15; v.pitch = null; v.pitchT = null; v.swing = null; }
      else { v.windup = null; v.pitch = pitch; v.pitchT = c - 1.15; v.swing = v.pitchT > pitch.T - 0.07 ? { t: v.pitchT - pitch.T + 0.07, result: { contact: (Math.floor(t / 3.2) % 2) === 0, quality: 1, ev: 104, la: 25, spray: -10, timingErr: 0 } } : null; }
    }
    if (v.scene === 'field' && v.play) v.playT = (t % (v.play.dur + 0.6));
    BB.Render.frame(v);
    requestAnimationFrame(loop);
  };
  loop();
}
</script>
