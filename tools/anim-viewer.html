<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animation library viewer</title>
<style>
  html, body { margin: 0; background: #FFF4DC; font: 600 13px/1.2 system-ui, sans-serif; color: #1B1420; }
  #wrap { position: relative; display: inline-block; }
  canvas { display: block; }
  .lbl { position: absolute; padding: 2px 6px; background: rgba(255, 244, 220, 0.85); border-radius: 4px; pointer-events: none; white-space: nowrap; }
  #ui { position: fixed; right: 8px; top: 8px; background: #fff8ea; border: 2px solid #1B1420; border-radius: 8px; padding: 8px; display: none; }
  body.interactive #ui { display: block; }
  #ui div { margin: 3px 0; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ui">
  <div><select id="clip"></select> <label><input type="checkbox" id="play" checked> play</label> <input type="range" id="time" min="0" max="1" step="0.001" value="0" style="width:180px"></div>
  <div><select id="view"><option>q34</option><option>front</option><option>left</option><option>right</option><option>back</option><option>bat</option><option>batzoom</option></select>
  speed <select id="speed"><option>1</option><option>0.5</option><option>0.25</option></select></div>
</div>
<script src="../src/vendor/three.min.js"></script>
<script src="../src/vendor/three-addons.js"></script>
<script>
// Animation library viewer (docs/CAST-CONTRACT.md "Animation libraries"): plays the shared clips (assets/src/anim_*.glb)
// on a character body (the reference body assets/src/ref_body.glb, or any cast glb) by bone name, the way the runtime
// binds them: tracks are named after the bones (three.js strips the dots: hand.R -> handR), root/hips translation is
// rescaled by hipHeight / refHipHeight. Toon materials + inverted-hull outlines, the field (mound, rubber, plate), the
// game's bat camera, ball and sockets from the sidecars. Interactive: anim-viewer.html?lib=pitcher (served next to
// the repo); tools/anim-shots.js drives window.viewer for contact sheets.
(function () {
  const T = THREE, PI = Math.PI, D2R = PI / 180;
  const CREAM = 0xFFF4DC, INK = 0x1B1420;
  const canvas = document.getElementById('c');
  const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.setPixelRatio(1);
  renderer.autoClear = false;
  const scene = new T.Scene();
  const amb = new T.AmbientLight(0xffffff, 0.55); scene.add(amb);
  const key = new T.DirectionalLight(0xfff0d8, 0.75); scene.add(key); scene.add(key.target);
  const grad = (function () {
    const d = new Uint8Array([120, 190, 255]);
    const t = new T.DataTexture(d, 3, 1, T.RedFormat);
    t.minFilter = t.magFilter = T.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t;
  })();
  const toon = (c) => new T.MeshToonMaterial({ color: c, gradientMap: grad });
  const res = { value: new T.Vector2(800, 800) };

  // ---------------------------------------------------------------- the field (game coords: Z up, +y to the mound)
  const world = new T.Group(); scene.add(world);
  const field = new T.Group(); world.add(field);
  const grass = new T.Mesh(new T.PlaneGeometry(400, 400), toon(0x6DBB4A)); grass.position.set(0, 60, -0.02); field.add(grass);
  const dirt = new T.Mesh(new T.CircleGeometry(13, 48), toon(0xD9955B)); dirt.position.set(0, 0, -0.01); field.add(dirt);
  // mound: flat top 0.83 ft within 5 ft of (0, 59), sloping to 0 at 9 ft (BB.Park.mound)
  const prof = []; for (let k = 0; k <= 10; k++) { const r = 9.6 - k * 0.96; const d = Math.max(0.01, r); prof.push(new T.Vector2(d, d < 5 ? 0.83 : d < 9 ? 0.83 * (9 - d) / 4 : 0)); }
  const mound = new T.Mesh(new T.LatheGeometry(prof.reverse(), 40), toon(0xD9955B)); mound.rotation.x = PI / 2; mound.position.set(0, 59, 0); field.add(mound);
  const rubber = new T.Mesh(new T.BoxGeometry(2, 0.5, 0.08), toon(0xffffff)); rubber.position.set(0, 60.5, 0.84); field.add(rubber);
  const plate = new T.Mesh(new T.ShapeGeometry(new T.Shape([new T.Vector2(-0.708, 0), new T.Vector2(0.708, 0), new T.Vector2(0.708, -0.708), new T.Vector2(0, -1.416), new T.Vector2(-0.708, -0.708)])), new T.MeshBasicMaterial({ color: 0xffffff }));
  plate.position.z = 0.01; field.add(plate);
  // a plain ground disc for model sheets
  const sheetGround = new T.Mesh(new T.CircleGeometry(7, 48), toon(0xE3B07E)); world.add(sheetGround);
  const zoneMat = new T.LineBasicMaterial({ color: 0x2E5AAC });
  const zone = new T.LineLoop(new T.BufferGeometry().setFromPoints([new T.Vector3(-0.83, 0, 1.55), new T.Vector3(0.83, 0, 1.55), new T.Vector3(0.83, 0, 3.45), new T.Vector3(-0.83, 0, 3.45)]), zoneMat);
  world.add(zone);

  function outlineMaterial(width) {
    const m = new T.MeshBasicMaterial({ color: INK, side: T.BackSide });
    m.userData.width = { value: width };
    m.onBeforeCompile = (sh) => {
      sh.uniforms.uWidth = m.userData.width; sh.uniforms.uRes = res;
      sh.vertexShader = 'uniform float uWidth; uniform vec2 uRes;\n' + sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
        vec4 nc = projectionMatrix * modelViewMatrix * vec4(objectNormal, 0.0);
        vec2 dir = length(nc.xy) > 1e-5 ? normalize(nc.xy) : vec2(0.0);
        gl_Position.xy += dir * uWidth * gl_Position.w * 2.0 / uRes;
        gl_Position.z += 0.0004 * gl_Position.w;`);
    };
    return m;
  }

  // ---------------------------------------------------------------- body + libraries
  const V = { body: null, libs: {}, clips: {}, side: {}, actors: [], ref: 1.70 };
  const COLORS = { team_a: 0x2E5AAC, team_b: 0xD9483B, cap: 0x2E5AAC, decal_chest: 0x2E5AAC, decal_back: 0x2E5AAC };
  function parse(buf) { return new Promise((ok, err) => { const L = new T.GLTFLoader(); if (T.MeshoptDecoder) L.setMeshoptDecoder(T.MeshoptDecoder); L.parse(buf, '', ok, err); }); }
  const nameOf = (o) => (o.userData && o.userData.name) || o.name;

  // an actor: a clone of the body with toon materials, outlines, a mixer for the library clips, props
  function makeActor(opts) {
    opts = opts || {};
    const g = V.body;
    const model = T.SkeletonUtils.clone(g.scene);
    const A = { root: new T.Group(), up: new T.Group(), model, bones: {}, meshes: [], mixer: null, acts: {}, rest: [], opts };
    A.up.rotation.x = PI / 2; A.root.add(A.up); A.up.add(model); world.add(A.root);
    model.traverse((o) => { if (o.isBone || o.type === 'Object3D') { A.bones[nameOf(o)] = o; } if (o.isMesh) A.meshes.push(o); });
    const hideMats = opts.hide || [];
    A.meshes.forEach((o) => {
      const src = o.material, name = src.name;
      const col = opts.colors && opts.colors[name] != null ? opts.colors[name] : (COLORS[name] != null ? COLORS[name] : src.color.getHex());
      const mat = /^decal/.test(name) ? new T.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.0, depthWrite: false }) : toon(col);
      mat.name = name; o.material = mat; o.frustumCulled = false;
      o.visible = !hideMats.includes(name);
      if (!/^decal/.test(name) && o.isSkinnedMesh) {
        const ol = new T.SkinnedMesh(o.geometry, outlineMaterial(name === 'pupil' || name === 'eye_white' ? 1.0 : (opts.outline || 1.8)));
        ol.bind(o.skeleton, o.bindMatrix); ol.frustumCulled = false;
        if (o.morphTargetInfluences) { ol.morphTargetInfluences = o.morphTargetInfluences; ol.morphTargetDictionary = o.morphTargetDictionary; }
        o.add(ol); ol.visible = o.visible;
      }
    });
    model.traverse((o) => { A.rest.push([o, o.position.clone(), o.quaternion.clone(), o.scale.clone()]); });
    A.heads = A.meshes.filter((m) => m.morphTargetDictionary && Object.keys(m.morphTargetDictionary).length);
    A.mixer = new T.AnimationMixer(model);
    for (const n in V.clips) { const a = A.mixer.clipAction(V.clips[n]); a.play(); a.setEffectiveWeight(0); a.enabled = false; A.acts[n] = a; }
    // props: ball (white), optional catcher mitt marker
    A.ball = new T.Mesh(new T.SphereGeometry(0.121, 18, 12), toon(0xffffff)); A.ball.visible = false; world.add(A.ball);
    const bo = new T.Mesh(A.ball.geometry, outlineMaterial(1.4)); A.ball.add(bo);
    if (opts.tailless) ['tail.1', 'tail1'].forEach((b) => { if (A.bones[b]) A.bones[b].scale.setScalar(0.001); });
    A.hipK = (opts.hipHeight || V.bodyHip || V.ref) / V.ref;
    V.actors.push(A);
    return A;
  }
  function restPose(A) { A.rest.forEach(([o, p, q, s]) => { o.position.copy(p); o.quaternion.copy(q); o.scale.copy(s); }); if (A.opts.tailless && A.bones.tail1) A.bones.tail1.scale.setScalar(0.001); }
  function faceAt(A, clip, t) {
    const side = V.side[clip.split(':')[0]] || null;
    const tracks = side && side.face ? side.face : null;
    A.heads.forEach((m) => m.morphTargetInfluences.fill(0));
    if (!tracks) return;
    for (const k in tracks) {
      const kk = tracks[k]; let v = 0;
      if (t <= kk[0][0]) v = kk[0][1]; else if (t >= kk[kk.length - 1][0]) v = kk[kk.length - 1][1];
      else for (let i = 1; i < kk.length; i++) if (t <= kk[i][0]) { const u = (t - kk[i - 1][0]) / (kk[i][0] - kk[i - 1][0]); v = kk[i - 1][1] + (kk[i][1] - kk[i - 1][1]) * u; break; }
      A.heads.forEach((m) => { const i = m.morphTargetDictionary[k]; if (i != null) m.morphTargetInfluences[i] = v; });
    }
  }
  // pose an actor: clip at time t (clamped, or looped), hips translation retargeted, the ball where the sidecar says
  function pose(A, clip, t, extra) {
    A.mixer.stopAllAction(); restPose(A);
    for (const n in A.acts) { A.acts[n].enabled = false; A.acts[n].setEffectiveWeight(0); }
    if (clip && A.acts[clip]) {
      const a = A.acts[clip], d = V.clips[clip].duration, sd = V.side[clip] || {};
      a.enabled = true; a.setEffectiveWeight(1); a.play();
      a.time = sd.loop ? ((t % d) + d) % d : Math.min(Math.max(t, 0), d);
      A.mixer.update(0);
      if (A.hipK !== 1 && A.bones.hips) A.bones.hips.position.multiplyScalar(A.hipK);
      faceAt(A, clip, a.time);
    }
    A.root.updateMatrixWorld(true);
    // ball
    A.ball.visible = false;
    const sd = clip && V.side[clip];
    if (sd && sd.ball && !(extra && extra.noBall)) {
      let at = null; for (const [bn, t0] of sd.ball) if (t >= t0 - 1e-6) at = bn;
      if (at && boneOf(A, at)) { const p = boneWorld(A, at); A.ball.position.copy(p); A.ball.visible = true; }
    }
  }
  function boneOf(A, n) { return A.bones[n] || A.bones[n.replace(/\./g, '')]; }
  function boneWorld(A, n) { const b = boneOf(A, n); if (!b) return null; const v = new T.Vector3(); b.getWorldPosition(v); return v; }

  // ---------------------------------------------------------------- cameras
  function orbitCam(az, el, dist, target, fov, aspect) {
    const c = new T.PerspectiveCamera(fov || 26, aspect, 0.1, 2000); c.up.set(0, 0, 1);
    const tg = new T.Vector3().fromArray(target);
    const a = az * D2R, e = el * D2R;
    c.position.set(tg.x + Math.sin(a) * Math.cos(e) * dist, tg.y - Math.cos(a) * Math.cos(e) * dist, tg.z + Math.sin(e) * dist);
    c.lookAt(tg); return c;
  }
  // the game's bat camera for a W x H screen (src/35-scene.js layoutBat, 'tall' framing, interpolated toward 'wide')
  const BATCAM = { aim: [0, 0, 2.5], tall: { a: 0.462, pos: [-0.6, -28, 9.6], ppfW: 0.140, ppfH: 0.072, at: [0.63, 0.655] }, wide: { a: 0.563, pos: [-1.6, -23, 7.3], ppfW: 0.156, ppfH: 0.078, at: [0.62, 0.675] } };
  function batCam(W, H, zoom, center) {
    const B = BATCAM, k = Math.min(1, Math.max(0, (W / H - B.tall.a) / (B.wide.a - B.tall.a))), L = (f) => B.tall[f] + (B.wide[f] - B.tall[f]) * k;
    const pos = [0, 1, 2].map((i) => B.tall.pos[i] + (B.wide.pos[i] - B.tall.pos[i]) * k), at = [0, 1].map((i) => B.tall.at[i] + (B.wide.at[i] - B.tall.at[i]) * k);
    const ppf = Math.min(L('ppfW') * W, L('ppfH') * H), d = Math.hypot(pos[0] - B.aim[0], pos[1] - B.aim[1], pos[2] - B.aim[2]);
    const fov = 2 * Math.atan(H / 2 / (ppf * d)) * 180 / PI;
    const c = new T.PerspectiveCamera(fov, W / H, 1, 12000); c.up.set(0, 0, 1); c.position.fromArray(pos); c.lookAt(B.aim[0], B.aim[1], B.aim[2]);
    c.setViewOffset(W, H, (0.5 - at[0]) * W, (0.5 - at[1]) * H, W, H); c.updateProjectionMatrix(); c.updateMatrixWorld(true);
    if (zoom && zoom > 1) {   // same camera, magnified around a world point (what a player sees, bigger)
      const p = new T.Vector3().fromArray(center).project(c), sx = (p.x + 1) / 2 * W, sy = (1 - p.y) / 2 * H;
      const w = W / zoom, h = H / zoom;
      c.setViewOffset(W, H, (0.5 - at[0]) * W + sx - w / 2, (0.5 - at[1]) * H + sy - h / 2, w, h);
      c.updateProjectionMatrix();
    }
    return c;
  }
  function makeCam(view, aspect, cw, ch) {
    if (view.bat) return batCam(view.W || 390, view.H || 844, view.zoom || 1, view.center || [0, 60, 4]);
    if (view.cam) { const c = new T.PerspectiveCamera(view.fov || 30, aspect, 0.1, 4000); c.up.set(0, 0, 1); c.position.fromArray(view.cam); c.lookAt(new T.Vector3().fromArray(view.look)); return c; }
    return orbitCam(view.az || 0, view.el != null ? view.el : 6, view.dist || 16, view.target || [0, 0, 2.5], view.fov || 26, aspect);
  }

  // ---------------------------------------------------------------- sheets
  const wrap = document.getElementById('wrap');
  function clearLabels() { wrap.querySelectorAll('.lbl').forEach((e) => e.remove()); }
  function label(x, y, text) { const d = document.createElement('div'); d.className = 'lbl'; d.style.left = x + 'px'; d.style.top = y + 'px'; d.textContent = text; wrap.appendChild(d); }
  // spec: { cols, cellW, cellH, field, cells: [{ actors: [{ clip, t, place: {x,y,z,yaw}, hide }], view, label, trail, marks }] }
  // place.yaw: 0 = the character faces game -y (toward home plate), PI = faces +y (toward the mound)
  function placeActor(A, pl) {
    pl = pl || {};
    A.root.position.set(pl.x || 0, pl.y || 0, pl.z || 0); A.root.rotation.set(0, 0, pl.yaw || 0); A.root.scale.setScalar(pl.size || 1);
    if (pl.mirror) A.up.scale.set(-1, 1, 1); else A.up.scale.set(1, 1, 1);
    A.root.visible = true; A.root.updateMatrixWorld(true);
  }
  function sheet(spec) {
    const cols = spec.cols || 4, cw = spec.cellW || 300, ch = spec.cellH || 400, n = spec.cells.length, rows = Math.ceil(n / cols);
    renderer.setSize(cols * cw, rows * ch, false); canvas.style.width = cols * cw + 'px'; canvas.style.height = rows * ch + 'px';
    clearLabels();
    renderer.setScissorTest(true);
    renderer.setClearColor(spec.bg != null ? spec.bg : CREAM, 1);
    renderer.setViewport(0, 0, cols * cw, rows * ch); renderer.setScissor(0, 0, cols * cw, rows * ch); renderer.clear();
    const out = [];
    spec.cells.forEach((cell, i) => {
      const cx = (i % cols) * cw, cy = Math.floor(i / cols) * ch;
      const acts = cell.actors || spec.actors || [];
      while (V.actors.length < acts.length) makeActor(spec.actorOpts || {});
      V.actors.forEach((A, k) => { A.root.visible = k < acts.length; A.ball.visible = false; });
      const isField = cell.field != null ? cell.field : spec.field;
      field.visible = !!isField; sheetGround.visible = !isField && cell.ground !== false && spec.ground !== false; zone.visible = !!(cell.zone || spec.zone);
      const info = {};
      const trails = [];
      acts.forEach((a, k) => {
        const A = V.actors[k];
        placeActor(A, a.place);
        A.meshes.forEach((m) => { m.visible = !(a.hide || spec.hide || []).includes(m.material.name); });
        if (a.trail) {
          const tr = a.trail, colsT = [0xD9483B, 0x2E5AAC, 0x2F7A4A, 0x8A5A3C];
          (tr.bones || ['grip.R']).forEach((bn, bi) => {
            const pts = [];
            const nn = tr.n || 40;
            for (let s = 0; s <= nn; s++) { const tt = tr.from + (tr.to - tr.from) * s / nn; pose(A, a.clip, tt, { noBall: true }); const v = boneWorld(A, bn); if (v) pts.push(v.clone()); }
            const g = new T.BufferGeometry().setFromPoints(pts);
            const line = new T.Line(g, new T.LineBasicMaterial({ color: colsT[bi % 4], depthTest: false }));
            const dots = new T.Points(g, new T.PointsMaterial({ color: colsT[bi % 4], size: 4, sizeAttenuation: false, depthTest: false }));
            line.renderOrder = dots.renderOrder = 10; scene.add(line); scene.add(dots); trails.push(line, dots);
          });
        }
        pose(A, a.clip, a.t || 0);
        const bi = {};
        (cell.report || ['grip.R', 'mitt', 'hand.R', 'hand.L', 'head', 'hips']).forEach((b) => { const v = boneWorld(A, b); if (v) bi[b] = [v.x, v.y, v.z].map((x) => +x.toFixed(4)); });
        info['a' + k] = bi;
      });
      const marks = [];
      (cell.marks || []).forEach((m) => { const s = new T.Mesh(new T.SphereGeometry(m.r || 0.12, 12, 8), new T.MeshBasicMaterial({ color: m.color || 0xD9483B, depthTest: m.depthTest !== false })); s.position.fromArray(m.p); s.renderOrder = 11; scene.add(s); marks.push(s); });
      const cam = makeCam(cell.view || spec.view || {}, cw / ch, cw, ch);
      key.position.copy(cam.position).add(new T.Vector3(4, -3, 10)); key.target.position.set(0, 0, 2);
      res.value.set(cw, ch);
      renderer.setViewport(cx, rows * ch - cy - ch, cw, ch); renderer.setScissor(cx, rows * ch - cy - ch, cw, ch);
      if (cell.bg != null) { renderer.setClearColor(cell.bg, 1); }
      renderer.clear(); renderer.render(scene, cam);
      renderer.setClearColor(spec.bg != null ? spec.bg : CREAM, 1);
      trails.forEach((o) => { scene.remove(o); o.geometry.dispose(); });
      marks.forEach((o) => { scene.remove(o); o.geometry.dispose(); });
      if (cell.label) label(cx + 4, cy + 4, cell.label);
      out.push(info);
    });
    renderer.setScissorTest(false);
    return out;
  }

  const viewer = window.viewer = {
    V, sheet, pose, boneWorld, makeActor,
    async load(bodyBuf, libs, opts) {   // libs: { name: [glbBuffer, sidecarJson] }
      opts = opts || {};
      V.body = await parse(bodyBuf);
      const ex = (V.body.parser && V.body.parser.json.scenes && V.body.parser.json.scenes[0].extras) || {};
      V.bodyHip = ex.hipHeight || 1.70;
      for (const ln in libs) {
        const [buf, side] = libs[ln];
        const g = await parse(buf);
        V.libs[ln] = g;
        if (side && side.refHipHeight) V.ref = side.refHipHeight;
        g.animations.forEach((c) => { V.clips[c.name] = c; V.side[c.name] = Object.assign({}, (side && side.clips && side.clips[c.name]) || {}); if (side && side.face && side.face[c.name]) V.side[c.name].face = side.face[c.name]; });
      }
      return Object.keys(V.clips);
    },
    clipInfo() { const o = {}; for (const n in V.clips) o[n] = { duration: +V.clips[n].duration.toFixed(4), tracks: V.clips[n].tracks.length }; return o; },
    // world positions of bones over time (for numeric checks in the harness)
    sample(clip, bones, times, place) {
      if (!V.actors.length) makeActor({});
      const A = V.actors[0]; placeActor(A, place || {});
      return times.map((t) => { pose(A, clip, t, { noBall: true }); const o = {}; bones.forEach((b) => { const v = boneWorld(A, b); o[b] = v ? [v.x, v.y, v.z] : null; }); return o; });
    },
  };

  // ---------------------------------------------------------------- interactive mode
  const q = new URLSearchParams(location.search);
  if (!q.has('harness')) {
    document.body.classList.add('interactive');
    const lib = q.get('lib') || 'pitcher';
    const body = q.get('body') || '../assets/src/ref_body.glb';
    Promise.all([fetch(body).then((r) => r.arrayBuffer()), fetch('../assets/src/anim_' + lib + '.glb').then((r) => r.arrayBuffer()), fetch('../assets/anim_' + lib + '.json').then((r) => r.json()).catch(() => null)])
      .then(([b, l, s]) => viewer.load(b, { [lib]: [l, s] })).then((names) => {
        const selC = document.getElementById('clip'); selC.innerHTML = names.map((n) => `<option>${n}</option>`).join('');
        const tm = document.getElementById('time'), play = document.getElementById('play'), selV = document.getElementById('view'), spd = document.getElementById('speed');
        let t0 = performance.now(), last = performance.now(), tt = 0;
        function loop() {
          requestAnimationFrame(loop);
          const now = performance.now(), dt = (now - last) / 1000; last = now;
          const clip = selC.value, dur = V.clips[clip] ? V.clips[clip].duration : 1;
          if (play.checked) { tt = (tt + dt * +spd.value) % (dur + 0.6); tm.value = Math.min(1, tt / dur); }
          const t = tm.value * dur, v = selV.value;
          const role = clip.split('_')[0];
          const place = role === 'p' ? { x: 0, y: 60.5, z: 0.83 } : role === 'c' ? { x: 0, y: -2.7, yaw: PI } : role === 'u' ? { x: 0.6, y: -5.6, yaw: PI } : { x: 0, y: 0 };
          const view = v === 'bat' ? { bat: true, W: innerWidth, H: innerHeight } : v === 'batzoom' ? { bat: true, W: innerWidth, H: innerHeight, zoom: 3, center: [place.x, place.y, 3] }
            : { az: { q34: 35, front: 0, left: 90, right: -90, back: 180 }[v] + (place.yaw ? 180 : 0), el: 8, dist: 17, target: [place.x, place.y, (place.z || 0) + 2.6] };
          sheet({ cols: 1, cellW: innerWidth, cellH: innerHeight, field: true, cells: [{ actors: [{ clip, t, place }], view }] });
        }
        loop();
      });
  }
})();
</script>
