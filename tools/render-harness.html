<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Render harness · Screwball Slugger</title>
<!-- fonts: local copies (fetched by tools/render-shots.js into qa/render/fonts), else system fallbacks -->
<style>
@font-face { font-family: 'Luckiest Guy'; src: url(../qa/render/fonts/LuckiestGuy.woff2) format('woff2'); }
@font-face { font-family: 'Fredoka'; font-weight: 300 700; src: url(../qa/render/fonts/Fredoka.woff2) format('woff2'); }
html, body { margin: 0; background: #FFF4DC; overflow: hidden; }
canvas#game { display: block; position: fixed; left: 0; top: 0; }
#grid { display: none; padding: 8px; gap: 8px; flex-wrap: wrap; align-content: flex-start; background: #E9E1CF; min-height: 100vh; box-sizing: border-box; }
#grid canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="grid"></div>
<script src="../src/vendor/three.min.js"></script>
<script src="../src/vendor/three-addons.js"></script>
<script>window.BB_RENDER_HQ = true;</script>
<script src="../src/00-const.js"></script>
<script>
// load the sim + render modules (missing optional ones are fine)
var MODS = ['10-pitch.js', '15-bat.js', '20-content.js', '30-assets.js', '31-toon.js', '32-cast.js', '33-park.js', '34-anim.js', '35-scene.js', '36-actors.js', '36-rocco.js', '37-ink.js', '38-cards.js'];
// the hero model: ?glb=<path> (tools/render-shots.js passes what the build ships: the packed model, or e.g. the
// integration proxy), else ../assets/rocco.glb; ?lod1=<path> adds his level of detail. Handed to BB.Assets before the
// renderer boots. Needs --allow-file-access-from-files for file:// XHR; without it the procedural Rocco is used.
var GLB = {};
(function () {
  function arg(k) { var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
  var want = [['rocco', arg('glb') || '../assets/rocco.glb']];
  if (arg('lod1')) want.push(['rocco.lod1', arg('lod1')]);
  function go() { (function next(i) {
    if (i >= MODS.length) return boot();
    var s = document.createElement('script'); s.src = '../src/' + MODS[i];
    s.onload = s.onerror = function () { next(i + 1); };
    document.head.appendChild(s);
  })(0); }
  (function fetchOne(i) {
    if (i >= want.length) return go();
    try {
      var x = new XMLHttpRequest(); x.open('GET', want[i][1]); x.responseType = 'arraybuffer';
      x.onload = function () { if ((x.status === 200 || x.status === 0) && x.response && x.response.byteLength) GLB[want[i][0]] = x.response; fetchOne(i + 1); };
      x.onerror = function () { fetchOne(i + 1); };
      x.send();
    } catch (e) { fetchOne(i + 1); }
  })(0);
})();

var Q = {};
function qs(str) { var o = {}; (str || '').replace(/^\?/, '').split('&').forEach(function (kv) { if (!kv) return; var p = kv.split('='); o[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); }); return o; }

// ---------------------------------------------------------------- mocks
var MOCK_PARK = {
  id: 'p_mock', name: 'Mock Meadow', town: 'Mockton', inkset: 'classic',
  fence: [[-45, 330, 10], [-20, 370, 10], [0, 400, 12], [20, 370, 10], [45, 330, 10]],
  features: { scoreboard: true, lights: true, billboard: 'EAT AT JOE\'S · BEST PIE', water: 'right', hill: false, skyline: 'city' },
};
var MOCK_PITCHER = { id: 'p_mock', name: 'Mock McGee', hand: 'R', team: 'Mockers', velo: 90, arsenal: { FB: 0.6, SL: 0.4 }, control: 0.6, stuff: 0.6,
  look: { build: 'tall', hair: 'mustache', windup: 'classic', number: 27 } };
function parks() { return (BB.Content && BB.Content.PARKS && BB.Content.PARKS.length) ? BB.Content.PARKS : [MOCK_PARK]; }
function pitchers() { return (BB.Content && BB.Content.PITCHERS && BB.Content.PITCHERS.length) ? BB.Content.PITCHERS : [MOCK_PITCHER]; }
function mockPitch(pitcher, seed, type, strike, pz, px) {
  if (BB.Pitch && BB.Pitch.make) {
    for (var k = 0; k < 4000; k++) {
      var p = BB.Pitch.make(pitcher, { balls: 0, strikes: 0, derby: true, id: 1 }, BB.U.rng(seed + k));
      if ((!type || p.type === type) && (strike == null || p.strike === strike) && (pz == null || Math.abs(p.plate.z - pz) < 0.12) && (px == null || Math.abs(p.plate.x - px) < 0.15)) return p;
    }
  }
  var T = 0.72;
  return { id: 0, type: 'FB', name: 'Fastball', mph: 94, T: T, release: { x: -1.75, y: 54.5, z: 6 }, plate: { x: 0.2, z: 2.6 }, strike: true,
    pos: function (t) { var s = t / T; if (s > 1) return { x: 0.2, y: -3 * Math.min(1, (s - 1) * 4), z: 2.5 }; return { x: -1.75 + 1.95 * s, y: 54.5 * (1 - s), z: 6 - 3.4 * s + 0.6 * 4 * s * (1 - s) }; } };
}
function mockPlay(park, want) {
  var sw = want === 'hr' ? { contact: true, label: 'PERFECT', quality: 1, sweet: true, ev: 110, la: 29, spray: -14, power: true }
    : want === 'gap' ? { contact: true, label: 'GREAT', quality: 0.8, sweet: false, ev: 101, la: 17, spray: 24, power: false }
    : want === 'wall' ? { contact: true, label: 'GREAT', quality: 0.85, sweet: false, ev: 104, la: 22, spray: -2, power: false }
    : want === 'fly' ? { contact: true, label: 'GOOD', quality: 0.6, sweet: false, ev: 92, la: 34, spray: 8, power: false }
    : want === 'foul' ? { contact: true, label: 'LATE', quality: 0.3, sweet: false, ev: 80, la: 30, spray: 58, power: false }
    : { contact: true, label: 'EARLY', quality: 0.4, sweet: false, ev: 84, la: -6, spray: -18, power: false };
  var match = { hr: function (p) { return p.type === 'HR'; }, gap: function (p) { return p.type === '2B' || p.type === '3B'; },
    wall: function (p) { return p.wall && p.type !== 'HR'; }, ground: function (p) { return p.type === 'OUT' && p.outKind === 'ground'; },
    fly: function (p) { return p.type === 'OUT' && p.outKind === 'fly'; }, foul: function (p) { return p.type === 'FOUL'; } }[want] || function () { return true; };
  if (BB.Bat && BB.Bat.play) {
    for (var k = 0; k < 400; k++) {
      var s2 = Object.assign({}, sw, { ev: sw.ev + (k % 7) - 3, la: sw.la + ((k * 3) % 9) - 4, spray: sw.spray + ((k * 5) % 11) - 5 });
      var pl = BB.Bat.play(s2, park, BB.U.rng(1000 + k), { bases: [true, false, false], outs: 1 });
      if (match(pl)) { pl._sw = s2; return pl; }
    }
  }
  var d = want === 'hr' ? 420 : want === 'gap' ? 330 : 120, sp = BB.U.rad(sw.spray), apex = want === 'hr' ? 95 : want === 'gap' ? 40 : 3, hang = want === 'ground' ? 1.2 : 4;
  var dur = Math.max(2.2, hang + 0.8);
  return { type: want === 'hr' ? 'HR' : want === 'gap' ? '2B' : 'OUT', outKind: want === 'ground' ? 'ground' : null, dist: d, dur: dur, hang: hang, wall: false, catchBy: -1, catchT: -1,
    ballAt: function (t) { var u = Math.min(1, t / hang); return { x: Math.sin(sp) * d * u, y: Math.cos(sp) * d * u, z: 3 + apex * 4 * u * (1 - u) }; },
    fielderAt: function (i, t) { var D = BB.Bat ? BB.Bat.FIELDERS[BB.Bat.ORDER[i]] : { x: 0, y: 100 }; return { x: D.x, y: D.y }; } };
}
function mockHud(o) {
  return Object.assign({ balls: 2, strikes: 1, outs: 1, outsMax: 3, bases: [true, false, true], inning: 'BOT 9', score: '3–4', goal: 'Bottom 9th. Down 1, runners on the corners, 1 out. Score 2 to win.', progress: '0 / 2 R', streak: 0 }, o || {});
}

// ---------------------------------------------------------------- scenes
var canvas, last = null;
function boot() {
  canvas = document.getElementById('game');
  Q = qs(location.search);
  if (Q.scene === 'cards') return cards();
  var w = +(Q.w || window.innerWidth), h = +(Q.h || window.innerHeight);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  if (BB.Assets) for (var gn in GLB) BB.Assets.provide(gn, GLB[gn]);
  BB.Render.init(canvas);
  BB.Render._S.noAdapt = true;
  BB.Render.resize(w, h, Math.min(window.devicePixelRatio || 1, 2));
  var fontsP = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load('20px "Luckiest Guy"'), document.fonts.load('700 12px "Fredoka"')]).catch(function () {}) : Promise.resolve();
  // wait for the hero model to parse (or to fail / be missing) before the first shot
  var modelP = new Promise(function (res) { var n = 0; (function poll() { var st = BB.Rocco && BB.Rocco.status ? BB.Rocco.status() : 'none'; if (st !== 'loading' && st !== 'idle' || n++ > 400) return res(st); setTimeout(poll, 15); })(); });
  // the game parses a match's models during the briefing (BB.Render.prepare): here, before the first shot
  var castP = modelP.then(function () { return BB.Render.prepare ? BB.Render.prepare(null, null) : null; }).catch(function () {});
  Promise.all([fontsP, modelP, castP]).then(function () {
    window.__rocco = BB.Rocco && BB.Rocco.info ? BB.Rocco.info() : null;
    window.setup = setup;
    setup(location.search);
    if (Q.anim) animate();
  });
}
function buildView(q) {
  var P = parks(), park = P[(+q.park || 0) % P.length], ps = pitchers();
  var pitcher = Object.assign({}, ps[(+q.pitcher || 0) % ps.length]);
  if (q.windstyle) pitcher.look = Object.assign({}, pitcher.look, { windup: q.windstyle });
  if (q.hand) pitcher.hand = q.hand;
  var bat = { id: 'b_hickory', name: 'Old Hickory' };
  BB.Render.setInks(q.ink || null);
  var v = { scene: q.scene || 'title', time: +(q.time || 3.2), park: park, pitcher: pitcher, bat: bat, windup: null, pitch: null, pitchT: null,
    swing: null, loading: null, assist: q.assist !== '0', play: null, playT: 0, runners: [], hud: q.nohud ? null : mockHud(q.hud ? JSON.parse(q.hud) : null),
    stamp: null, onFire: q.fire === '1', shake: +(q.shake || 0), hitstop: q.hitstop === '1', last: q.nolast ? null : { mph: 94, name: 'Slider' } };
  if (v.onFire) v.hud.streak = 4;
  if (q.outs10) v.hud = mockHud({ outs: 4, outsMax: 10, inning: 'DERBY', score: '3 HR', progress: '1,204 ft', goal: 'Hit home runs. Anything but a homer is an out.' });
  if (v.scene === 'bat') {
    var pitch = mockPitch(pitcher, +(q.seed || 7), q.ptype, q.strike != null ? q.strike === '1' : null, q.pz != null ? +q.pz : null, q.px != null ? +q.px : null);
    var st = q.state || 'idle';
    if (st === 'windup') v.windup = +(q.w || 0.5);
    if (st === 'loading') { v.windup = +(q.w || 0.85); v.loading = +(q.l || 1); }
    if (st === 'mid' || st === 'assist') { v.pitch = pitch; v.pitchT = pitch.T * +(q.f || 0.6); }
    if (st === 'stride') { v.pitch = pitch; v.pitchT = +(q.pt || 0.2); }
    if (st === 'loading' && q.pt != null) { v.windup = null; v.pitch = pitch; v.pitchT = +q.pt; }
    if (st === 'swing' || st === 'contact' || st === 'whiff') {
      v.pitch = pitch;
      var sw = +(q.st || (st === 'swing' ? 0.035 : 0.12)), late = +(q.late || 0);   // late: timing error (s) of a contact swing
      v.pitchT = pitch.T - 0.07 + sw + late;
      var res = st === 'whiff' ? { contact: false, label: 'WHIFF', timingErr: -0.15 } : { contact: true, label: late ? 'LATE' : 'PERFECT', quality: late ? 0.6 : 1, sweet: !late, ev: 106, la: 26, spray: late ? 20 : -8, timingErr: late };
      v.swing = { t: sw, result: res, power: !!q.power };
      if (st === 'contact') v.play = mockPlay(park, q.play || 'hr');
    }
    if (st === 'mitt' || st === 'called') { v.pitch = pitch; v.pitchT = pitch.T + +(q.dt || 0.08); }
  }
  if (v.scene === 'field') {
    var play = mockPlay(park, q.play || 'hr');
    v.play = play; v.playT = q.pt != null ? Math.min(play.dur, +q.pt) : Math.min(play.dur, play.dur * +(q.f || 0.5));
    if (q.extra) v._extra = +q.extra;
    v.runners = q.play === 'gap' ? [{ from: 1, to: 4 }, { from: 0, to: 2 }] : q.play === 'ground' ? [{ from: 1, to: 2 }, { from: 0, to: -1 }] : q.play === 'hr' || !q.play ? [{ from: 1, to: 4 }, { from: 0, to: 4 }] : [];
    if (q.play === 'gap') v.hud.bases = [false, true, false];
    if (q.play === 'hr' || !q.play) v.hud.bases = [false, false, false];
    if (q.play === 'ground') v.hud.bases = [false, true, false];
  }
  if (q.stamp) v.stamp = { text: q.stamp, sub: q.sub || '', t: +(q.stt || 0.5), kind: q.kind || 'good' };
  v.pre = q.pre ? { kind: q.pre, t: +(q.pret || 0.8) } : null;   // pre-pitch acting, said outright (the game infers it)
  return v;
}
function setup(search) {
  var q = qs(search);
  var ov = document.getElementById('bb-overlay'); if (ov) ov.style.display = '';
  last = buildView(q);
  // a scene change opens with an iris: render a frame of the same scene first unless the shot asks for the wipe
  BB.Render._S.prevScene = ''; BB.Render._S.lastScene = '';
  if (!q.iris) { var pre = Object.assign({}, last, { time: last.time - 1 }); BB.Render.frame(pre); }
  else { var pv = Object.assign({}, last, { scene: q.iris, time: last.time - 0.16 }); BB.Render.frame(pv); BB.Render._S.sceneT0 = last.time - 0.16; BB.Render._S.lastScene = last.scene; BB.Render._S.prevScene = q.iris; }
  BB.Render.frame(last);
  if (q.closeup && BB.Rocco && BB.Rocco.ready && BB.Rocco.ready()) closeup(q);
  window.__done = true;
  return true;
}
// debug: a close-up of the model's head (face shapes, gaze), drawn over the frame without the overlay.
// cside: radians around him from straight in front (+ = toward his left), cdist: ft, cfov: degrees
function closeup(q) {
  var S = BB.Render._S, h = BB.Rocco.headPoint(new THREE.Vector3()), cam = new THREE.PerspectiveCamera(+(q.cfov || 24), S.W / S.H, 0.3, 500);
  var yaw = BB.Rocco.root().rotation.z + +(q.cside || 0.5), d = +(q.cdist || 9);
  cam.up.set(0, 0, 1); cam.position.set(h.x + Math.sin(yaw) * d, h.y - Math.cos(yaw) * d, h.z + 1.2); cam.lookAt(h.x, h.y, h.z + 0.45 - +(q.cdown || 0));
  cam.updateProjectionMatrix();
  S.renderer.setRenderTarget(null); S.renderer.render(S.scene, cam);
  document.getElementById('bb-overlay').style.display = 'none';
  var hp = h.clone().setZ(h.z + 0.45).project(cam); window.__closeHead = { x: (hp.x + 1) / 2 * S.W, y: (1 - hp.y) / 2 * S.H };
}
function animate() {
  var t0 = performance.now(), q = qs(location.search), v = buildView(q), pitch = v.pitch || mockPitch(v.pitcher, 7);
  var loop = function () {
    var t = (performance.now() - t0) / 1000;
    v.time = t;
    if (v.scene === 'bat' && q.anim === 'cycle') {
      var c = t % 3.2;
      if (c < 1.15) { v.windup = c / 1.15; v.pitch = null; v.pitchT = null; v.swing = null; }
      else { v.windup = null; v.pitch = pitch; v.pitchT = c - 1.15; v.swing = v.pitchT > pitch.T - 0.07 ? { t: v.pitchT - pitch.T + 0.07, result: { contact: (Math.floor(t / 3.2) % 2) === 0, quality: 1, ev: 104, la: 25, spray: -10, timingErr: 0 } } : null; }
    }
    if (v.scene === 'field' && v.play) v.playT = (t % (v.play.dur + 0.6));
    BB.Render.frame(v);
    requestAnimationFrame(loop);
  };
  loop();
}

// ---------------------------------------------------------------- card grid (album sizing), only if BB.CardArt is loaded
function cards() {
  canvas.style.display = 'none';
  var grid = document.getElementById('grid'); grid.style.display = 'flex';
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (!BB.CardArt) { window.__done = true; return; }
  var fontsP = document.fonts ? Promise.all([document.fonts.load('20px "Luckiest Guy"'), document.fonts.load('700 12px "Fredoka"')]).catch(function () {}) : Promise.resolve();
  fontsP.then(function () {
    var rar = ['common', 'rare', 'foil', 'misprint'], names = ['Abner Grubbottom', 'Pee Wee Snodley', 'Dizzy McKettleson', 'Rube Wobberry', 'Hap Quillworth', 'Moose Tumblefield'];
    var pos = ['P', 'C', '1B', '2B', 'SS', '3B', 'LF', 'CF', 'RF', 'DH'];
    var teams = [['Haybale Hayseeds', 'HAY', 'a', 'classic'], ['Ironbridge Rivets', 'RIV', 'b', 'dusk'], ['Loon Lake Loons', 'LOO', 'c', 'lawn'],
      ['Gull Point Gulls', 'GUL', 'a', 'harbor'], ['Dry Wash Coyotes', 'DRY', 'b', 'grape'], ['Capitol Copperheads', 'CAP', 'c', 'ledger']];
    var big = Q.big === '1', cw = big ? 300 : 120, ch = Math.round(cw * 1.4), n = 0, t0 = performance.now();
    for (var i = 0; i < (big ? 4 : 20); i++) {
      var tm = teams[i % 6];
      var card = { id: 'mock-' + i, no: i + 1, name: names[i % names.length], pos: pos[i % pos.length], team: tm[0], teamShort: tm[1],
        teamColorSlot: tm[2], number: 3 + (i * 7) % 60, rarity: rar[big ? i : (i % 4)], seed: BB.U.hashStr('mock-' + i), inkset: tm[3], stat: '.312 AVG · 24 HR · 88 RBI' };
      var c = document.createElement('canvas'); c.width = cw * dpr; c.height = ch * dpr; c.style.width = cw + 'px'; c.style.height = ch + 'px';
      grid.appendChild(c);
      try { BB.CardArt.draw(c, card, { time: 0.6 + i * 0.2 }); } catch (e) { console.error(e); }
      n++;
    }
    window.__cardStats = { cards: n, firstMs: performance.now() - t0 };
    window.__done = true;
  });
}
</script>
</body>
</html>
