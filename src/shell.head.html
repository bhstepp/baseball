<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Luckiest+Guy&display=swap">
<style>
/* ===== classic theatrical cartoon UI (meta agent) ========================================================
   Cream cards, 3px ink outlines, rounded corners, hard offset ink shadows, squash-and-bounce buttons,
   headers on sunbursts, iris wipes. --a / --b / --c come from the current uniform (BB.INKSETS colour scheme). */
:root {
  --a: #2F6DB5; --b: #E0567F; --c: #F2B632;
  --cream: #FFF4DC; --ink: #1B1420; --white: #FFFDF6;
  --mustard: #F2B632; --brick: #D9483B; --teal: #7FD1D9; --sunset: #FFB36B; --grass: #6DBB4A; --navy: #2B2F5E;
  --a-d: color-mix(in srgb, var(--a) 72%, #2a1830); --b-d: color-mix(in srgb, var(--b) 72%, #2a1830);
  --a-l: color-mix(in srgb, var(--a) 22%, var(--cream)); --b-l: color-mix(in srgb, var(--b) 22%, var(--cream));
  --c-l: color-mix(in srgb, var(--c) 30%, var(--cream)); --c-ll: color-mix(in srgb, var(--c) 14%, var(--cream));
  --disp: "Luckiest Guy", "Arial Black", "Helvetica Neue", sans-serif;
  --body: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --ol: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink);
  --ol3: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 2.2px 2.2px 0 var(--ink), -2.2px 2.2px 0 var(--ink), 2.2px -2.2px 0 var(--ink), -2.2px -2.2px 0 var(--ink);
  --pop: cubic-bezier(.3,1.7,.45,1);
}
@supports not (color: color-mix(in srgb, red 50%, blue)) {
  :root { --a-d: var(--a); --b-d: var(--b); --a-l: #E8EEF6; --b-l: #FBE6EC; --c-l: #FBE7B8; --c-ll: #FDF0D2; }
}
html, body { margin: 0; height: 100%; background: var(--cream); }
html { font-size: clamp(13px, 4vw, 17px); -webkit-text-size-adjust: 100%; }
body {
  position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none;
  font-family: var(--body); font-weight: 500; color: var(--ink);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--navy); }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
#screens, #ghost { position: absolute; inset: 0; }
#ghost { z-index: 0; pointer-events: none; } #ghost * { pointer-events: none !important; }
#screens { z-index: 1; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-appearance: none; appearance: none; touch-action: manipulation; }
canvas.art { display: block; }

/* ---------- screens: cream with soft sunburst rays, iris wipe in */
.scr {
  position: absolute; inset: 0; pointer-events: auto; display: flex; flex-direction: column;
  padding: calc(var(--sat) + 8px) calc(var(--sar) + 16px) calc(var(--sab) + 12px) calc(var(--sal) + 16px);
  background-color: var(--cream); box-sizing: border-box; overflow: hidden; isolation: isolate;
  animation: iris .5s cubic-bezier(.55,0,.25,1) both;
}
.scr::before { /* sunburst from above the top edge */
  content: ""; position: absolute; left: -60%; right: -60%; top: -40%; height: 120%; z-index: -1; pointer-events: none;
  background: repeating-conic-gradient(from 0deg at 50% 30%, var(--c-ll) 0 7deg, transparent 7deg 14deg);
  -webkit-mask: radial-gradient(closest-side at 50% 30%, #000 30%, transparent 100%); mask: radial-gradient(closest-side at 50% 30%, #000 30%, transparent 100%);
}
.scr.clear { background-color: transparent; }
.scr.clear::before { display: none; }
.scr.overlay { background-color: color-mix(in srgb, var(--navy) 55%, transparent); animation: fadeIn .2s both; }
.scr.overlay::before { display: none; }
@keyframes iris { from { clip-path: circle(0% at var(--ix, 50%) var(--iy, 50%)); } to { clip-path: circle(150% at var(--ix, 50%) var(--iy, 50%)); } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { 0% { opacity: 0; transform: scale(.6) rotate(-3deg); } 70% { opacity: 1; transform: scale(1.05) rotate(1deg); } 100% { transform: none; } }

/* ---------- lettering */
.ol { color: var(--cream); text-shadow: var(--ol), 3px 4px 0 var(--ink); }
.toon { font-family: var(--disp); font-weight: 400; letter-spacing: .02em; line-height: 1; }
.small { font-size: .8rem; line-height: 1.35; }
.muted { opacity: .7; }
.dim { opacity: .45; }

/* ---------- header: back button, title on a sunburst, right slot */
.hdr { display: flex; align-items: center; gap: 10px; min-height: 54px; flex: none; margin-bottom: 8px; position: relative; z-index: 1; }
.hdr .ttl { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; }
.hdr .ttl span { position: relative; font-family: var(--disp); font-size: 1.65rem; line-height: 1.15; padding-top: 4px; color: var(--cream); text-shadow: var(--ol3), 3px 4px 0 var(--ink); white-space: nowrap; overflow: visible; transform: rotate(-2deg); display: inline-block; }
.hdr .ttl.long span { font-size: 1.32rem; }
.hdr .ttl::before { /* sunburst badge behind the title */
  content: ""; position: absolute; left: -26px; top: 50%; width: 120px; height: 120px; margin-top: -60px; z-index: -1; border-radius: 50%;
  background: repeating-conic-gradient(var(--c) 0 10deg, transparent 10deg 20deg);
  -webkit-mask: radial-gradient(circle, #000 25%, transparent 70%); mask: radial-gradient(circle, #000 25%, transparent 70%);
  animation: spin 40s linear infinite;
}
.back {
  width: 46px; height: 46px; flex: none; display: grid; place-items: center; font-family: var(--disp); font-size: 1.5rem; line-height: 1;
  color: var(--ink); background: var(--cream); border: 3px solid var(--ink); border-radius: 50%; box-shadow: 0 4px 0 var(--ink);
  transition: transform .3s var(--pop), box-shadow .1s;
}
.back svg { width: 22px; height: 22px; }
.back:active, .iconbtn:active { transform: translateY(3px) scale(1.08,.9); box-shadow: 0 1px 0 var(--ink); transition-duration: .05s; }
.body { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; margin: 0 -16px; padding: 6px 16px 22px; touch-action: pan-y; }
.body::-webkit-scrollbar { display: none; }
.foot { flex: none; display: flex; gap: 10px; padding-top: 12px; }
.foot > * { flex: 1; }

/* ---------- buttons: squash on press, bounce back */
.btn {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-height: 52px; padding: 8px 14px 6px; box-sizing: border-box; width: 100%;
  font-family: var(--disp); font-size: 1.12rem; line-height: 1.05; letter-spacing: .03em; text-transform: uppercase;
  color: var(--ink); background: var(--cream); border: 3px solid var(--ink); border-radius: 18px;
  box-shadow: 0 5px 0 var(--ink); transform-origin: 50% 100%;
  transition: transform .34s var(--pop), box-shadow .12s;
}
.btn::after { /* cartoon gloss */
  content: ""; position: absolute; left: 12px; right: 40%; top: 5px; height: 5px; border-radius: 4px; background: rgba(255,255,255,.55); pointer-events: none;
}
.btn > * { position: relative; }
.btn:active { transform: translateY(4px) scale(1.04, .9); box-shadow: 0 1px 0 var(--ink); transition-duration: .06s; }
.btn .sub { font-family: var(--body); font-size: .74rem; font-weight: 600; text-transform: none; letter-spacing: 0; opacity: .9; }
.btn.primary { background: var(--a); color: var(--cream); text-shadow: var(--ol); }
.btn.primary .sub { text-shadow: none; color: var(--cream); }
.btn.hot { background: var(--mustard); color: var(--brick); text-shadow: var(--ol), 0 3px 0 var(--ink); font-size: 1.5rem; }
.btn.hot.big { font-size: 1.75rem; padding-top: 10px; }
.btn.ghost { box-shadow: none; border-style: dashed; background: transparent; }
.btn.ghost::after { display: none; }
.btn.big { min-height: 64px; font-size: 1.3rem; border-radius: 22px; }
.btn[disabled], .btn.off { filter: saturate(.3); opacity: .55; }
.btn.danger { background: var(--brick); color: var(--cream); text-shadow: var(--ol); }
.row { display: flex; gap: 10px; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px 0 8px; box-sizing: border-box; flex: none;
  border: 3px solid var(--ink); border-radius: 999px; font-family: var(--disp); font-size: 1rem; padding-top: 2px; background: var(--cream); box-shadow: 0 3px 0 var(--ink);
}
.coin {
  width: 1.15em; height: 1.15em; border-radius: 50%; flex: none; box-sizing: border-box; display: inline-block; vertical-align: -.2em; position: relative; top: -1px;
  background: radial-gradient(circle at 35% 30%, #FFE89A 0 22%, var(--mustard) 24%); border: 2.5px solid var(--ink);
}
.coin::after { content: "$"; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--disp); font-size: .62em; color: #A86A12; padding-top: 1px; }
.badge {
  position: absolute; top: -10px; right: -8px; min-width: 26px; height: 26px; padding: 2px 6px 0; box-sizing: border-box; border-radius: 13px;
  background: var(--brick); color: var(--cream); font-family: var(--disp); font-size: .8rem; line-height: 22px; text-align: center; text-shadow: none;
  transform: rotate(10deg); border: 2.5px solid var(--ink); animation: wiggle 1.6s ease-in-out infinite;
}
@keyframes wiggle { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(-6deg) scale(1.12); } }
.card { position: relative; background: var(--cream); border: 3px solid var(--ink); border-radius: 20px; padding: 14px 16px; box-shadow: 5px 6px 0 var(--ink); }
.sect { font-family: var(--disp); font-size: 1.1rem; margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; color: var(--ink); }
.sect::after { content: ""; flex: 1; height: 6px; border-radius: 3px; background: var(--c-l); border: 2px solid var(--ink); }
.iconbtn { width: 46px; height: 46px; flex: none; display: grid; place-items: center; border: 3px solid var(--ink); border-radius: 50%; background: var(--cream); box-shadow: 0 4px 0 var(--ink); transition: transform .3s var(--pop); }
.iconbtn svg { width: 24px; height: 24px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- title */
.title .top { display: flex; align-items: center; gap: 8px; flex: none; }
.lvl { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.lvl .num { font-family: var(--disp); font-size: 1rem; background: var(--b); color: var(--cream); padding: 7px 9px 4px; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); text-shadow: var(--ol); white-space: nowrap; transform: rotate(-4deg); }
.bar { position: relative; flex: 1; height: 14px; border: 3px solid var(--ink); border-radius: 10px; background: var(--cream); overflow: hidden; max-width: 130px; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--mustard); display: block; border-right: 2.5px solid var(--ink); }
.bar > i::after { content: ""; position: absolute; left: 3px; right: 3px; top: 2px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.6); }
.logo { position: relative; flex: none; margin: 4px auto 0; width: 100%; max-width: 400px; height: clamp(190px, 31vh, 270px); display: flex; align-items: center; justify-content: center; }
.logo .burst {
  position: absolute; left: 50%; top: 50%; width: min(86vw, 330px); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
  background: repeating-conic-gradient(var(--c) 0 9deg, color-mix(in srgb, var(--c) 45%, var(--cream)) 9deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 52%, transparent 71%); mask: radial-gradient(circle, #000 52%, transparent 71%);
  animation: spin 50s linear infinite; z-index: 0;
}
.logo .words { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; transform: rotate(-5deg); margin-left: -14%; }
.logo .line { display: flex; white-space: nowrap; }
.logo .line + .line { margin-top: -.06em; margin-left: 1.1em; }
.logo .ch {
  display: inline-block; font-family: var(--disp); font-size: clamp(40px, 12.5vw, 58px); line-height: 1.02; padding: 0 .015em;
  color: var(--mustard); text-shadow: var(--ol3), 2px 2px 0 var(--ink), 3px 3px 0 var(--ink), 4px 4px 0 var(--ink), 5px 5px 0 var(--ink), 6px 6px 0 var(--ink);
  transform: translateY(var(--y, 0)) rotate(var(--r, 0deg)) scale(var(--s, 1)); animation: bob 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * -.12s);
}
.logo .line:nth-child(2) .ch { color: var(--cream); }
.logo .line:nth-child(2) .ch:nth-child(odd) { color: #FFE3C2; }
@keyframes bob { 50% { transform: translateY(calc(var(--y, 0px) - 5px)) rotate(var(--r, 0deg)) scale(var(--s, 1)); } }
.logo .tag {
  position: relative; margin-top: 10px; transform: rotate(2deg); font-family: var(--disp); font-size: .9rem; letter-spacing: .04em; padding: 6px 14px 3px;
  background: var(--b); color: var(--cream); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 0 3px 0 var(--ink); text-shadow: var(--ol);
}
.logo .mascot { position: absolute; z-index: 3; right: max(-2%, calc(50% - 205px)); bottom: -6px; animation: lean 3.2s ease-in-out infinite; transform-origin: 50% 100%; pointer-events: none; }
@keyframes lean { 50% { transform: rotate(3deg) translateY(-2px); } }
.logo .no { position: absolute; z-index: 3; left: max(0px, calc(50% - 195px)); top: 4%; width: 58px; height: 58px; display: grid; place-items: center; text-align: center; font-family: var(--disp); font-size: .76rem; line-height: 1; color: var(--ink); transform: rotate(-12deg); }
.logo .no { isolation: isolate; width: 66px; height: 66px; padding-top: 4px; box-sizing: border-box; }
.logo .no::before, .logo .no::after { content: ""; position: absolute; z-index: -1; clip-path: polygon(50% 0,61% 12%,77% 7%,79% 23%,95% 28%,88% 43%,100% 55%,86% 65%,90% 82%,73% 82%,65% 97%,50% 88%,35% 97%,27% 82%,10% 82%,14% 65%,0 55%,12% 43%,5% 28%,21% 23%,23% 7%,39% 12%); }
.logo .no::before { inset: 0; background: var(--ink); }
.logo .no::after { inset: 4px; background: var(--cream); }
.logo .no b { font-size: 1.15rem; font-weight: 400; display: block; color: var(--brick); }
.title .spacer { flex: 1; min-height: 6px; }
.menu { display: flex; flex-direction: column; gap: 13px; flex: none; position: relative; z-index: 2; }
.menu .btn.big { align-items: flex-start; text-align: left; padding-left: 18px; }
.menu .btn .lab { display: flex; align-items: center; gap: 8px; width: 100%; }
.menu .btn .lab .chev { margin-left: auto; font-size: 1.1rem; }
.menu .grid2 .btn { min-height: 56px; font-size: 1rem; }
.menu .links { display: flex; justify-content: center; gap: 12px; }
.menu .links button { min-height: 44px; padding: 2px 16px 0; background: var(--cream); border-radius: 22px; border: 3px solid var(--ink); font-weight: 600; font-size: .86rem; box-shadow: 0 3px 0 var(--ink); }
.menu .links button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.dot-live { width: 12px; height: 12px; border-radius: 50%; background: var(--brick); border: 2px solid var(--ink); display: inline-block; animation: blink 1.1s infinite; }
@keyframes blink { 50% { transform: scale(.6); } }
@media (max-height: 740px) {
  .logo { height: 176px; }
  .logo .ch { font-size: clamp(34px, 11vw, 50px); }
  .menu { gap: 10px; }
  .menu .btn.big { min-height: 56px; font-size: 1.15rem; }
  .menu .grid2 .btn { min-height: 48px; }
}
@media (max-height: 620px) {
  .logo { height: 128px; }
  .logo .ch { font-size: 32px; }
  .logo .tag, .logo .no { display: none; }
  .logo .mascot { transform: scale(.7); transform-origin: 100% 100%; animation: none; }
  .menu .btn.big { min-height: 50px; padding-top: 4px; padding-bottom: 3px; }
  .menu .btn .sub { font-size: .66rem; }
  .menu .links button { min-height: 44px; }
}

/* ---------- tour map: Reels */
.reel { position: relative; margin: 8px 0 26px; border: 3px solid var(--ink); border-radius: 22px; background: var(--cream); box-shadow: 5px 6px 0 var(--ink); overflow: hidden; }
.reel .cover { position: relative; padding: 22px 14px 20px 86px; min-height: 84px; background: var(--a); color: var(--cream); border-bottom: 3px solid var(--ink); overflow: hidden; isolation: isolate; }
.reel .cover::before { /* rays */
  content: ""; position: absolute; left: -40%; top: -80%; width: 120%; aspect-ratio: 1; z-index: -1;
  background: repeating-conic-gradient(rgba(255,244,220,.13) 0 9deg, transparent 9deg 18deg);
}
.reel .cover::after { /* film-strip sprockets top & bottom */
  content: ""; position: absolute; left: 0; right: 0; top: 4px; bottom: 4px; z-index: -1; pointer-events: none;
  background: radial-gradient(circle, rgba(27,20,32,.55) 0 3px, transparent 3.5px) 6px 0 / 18px 9px repeat-x, radial-gradient(circle, rgba(27,20,32,.55) 0 3px, transparent 3.5px) 6px 100% / 18px 9px repeat-x;
}
.reel .no { position: absolute; left: 12px; top: 50%; margin-top: -32px; width: 64px; height: 64px; border-radius: 50%; background: var(--cream); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--disp); line-height: .9; }
.reel .no::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: radial-gradient(circle at 50% 22%, var(--ink) 0 3px, transparent 3.5px), radial-gradient(circle at 22% 62%, var(--ink) 0 3px, transparent 3.5px), radial-gradient(circle at 78% 62%, var(--ink) 0 3px, transparent 3.5px); opacity: .18; }
.reel .no small { font-size: .62rem; letter-spacing: .08em; position: relative; }
.reel .no b { font-size: 1.8rem; font-weight: 400; position: relative; color: var(--brick); }
.reel h3 { margin: 0; font-family: var(--disp); font-weight: 400; font-size: 1.32rem; line-height: 1.08; text-shadow: var(--ol), 2px 3px 0 var(--ink); }
.reel .park { font-size: .8rem; font-weight: 700; margin-top: 4px; }
.reel .blurb { font-size: .78rem; margin-top: 3px; line-height: 1.3; opacity: .92; }
.reel .tot { position: absolute; right: 10px; top: 8px; font-family: var(--disp); font-size: .86rem; color: var(--ink); background: var(--mustard); padding: 4px 8px 1px; border: 2.5px solid var(--ink); border-radius: 10px; transform: rotate(4deg); }
.games { list-style: none; margin: 0; padding: 4px 0; }
.games li { display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 6px 14px; border-bottom: 2.5px dotted color-mix(in srgb, var(--ink) 25%, transparent); }
.games li:last-child { border-bottom: 0; }
.games li:active { background: var(--c-ll); }
.gstamp { position: relative; width: 46px; height: 46px; flex: none; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; font-family: var(--disp); font-size: 1.15rem; padding-top: 3px; box-sizing: border-box; background: var(--cream); box-shadow: 0 3px 0 var(--ink); }
.games li.won .gstamp { background: var(--grass); color: var(--cream); text-shadow: var(--ol); }
.games li.boss .gstamp { background: var(--brick); color: var(--cream); font-size: .74rem; text-shadow: var(--ol); width: 50px; height: 50px; clip-path: polygon(50% 0,61% 12%,77% 7%,79% 23%,95% 28%,88% 43%,100% 55%,86% 65%,90% 82%,73% 82%,65% 97%,50% 88%,35% 97%,27% 82%,10% 82%,14% 65%,0 55%,12% 43%,5% 28%,21% 23%,23% 7%,39% 12%); border: 0; box-shadow: none; }
.games li.boss .gstamp::before { content: ""; position: absolute; inset: 0; z-index: -1; }
.games li.locked { opacity: .45; }
.games li.locked .gstamp { border-style: dashed; box-shadow: none; }
.games li.next .gstamp { animation: nudge 1.2s var(--pop) infinite; background: var(--mustard); }
@keyframes nudge { 0%, 60%, 100% { transform: none; } 30% { transform: scale(1.14) rotate(-8deg); } }
.games .gt { flex: 1; min-width: 0; }
.games .gt b { display: block; font-family: var(--disp); font-weight: 400; font-size: 1.02rem; line-height: 1.1; padding-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.games .gt span { display: block; font-size: .74rem; line-height: 1.25; margin-top: 2px; opacity: .78; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stars { display: inline-flex; gap: 0; flex: none; }
.star { width: 20px; height: 20px; overflow: visible; }
.star path { fill: color-mix(in srgb, var(--ink) 10%, transparent); stroke: color-mix(in srgb, var(--ink) 40%, transparent); stroke-width: 2; stroke-linejoin: round; }
.star.on path { fill: var(--mustard); stroke: var(--ink); stroke-width: 2.2; }
.reel.locked .cover { filter: grayscale(.75) brightness(.9); }
.reel .lockmsg { padding: 14px 16px; font-size: .84rem; font-weight: 600; display: flex; gap: 12px; align-items: center; }
.lock { width: 22px; height: 26px; flex: none; }

/* ---------- briefing */
.brief .kicker { font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--a-d); }
.brief h2 { margin: 2px 0 12px; font-family: var(--disp); font-weight: 400; font-size: clamp(28px, 9vw, 40px); line-height: 1; color: var(--cream); text-shadow: var(--ol3), 3px 4px 0 var(--ink); transform: rotate(-1.5deg); transform-origin: 0 50%; padding-top: 4px; }
.matchup { display: flex; gap: 14px; align-items: flex-start; }
.portrait { position: relative; flex: none; transform: rotate(-3deg); border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; background: var(--cream); box-shadow: 5px 6px 0 var(--ink); animation: popIn .5s var(--pop) both .15s; }
.portrait canvas { display: block; }
.vs { position: absolute; z-index: 2; right: -16px; bottom: -12px; width: 44px; height: 44px; display: grid; place-items: center; font-family: var(--disp); font-size: 1.1rem; color: var(--cream); text-shadow: var(--ol); background: var(--brick); border: 3px solid var(--ink); border-radius: 50%; transform: rotate(-10deg); padding-top: 3px; box-sizing: border-box; }
.pinfo { flex: 1; min-width: 0; padding-top: 2px; }
.pinfo .nm { font-family: var(--disp); font-size: 1.25rem; line-height: 1.05; }
.pinfo .nick { font-size: .82rem; font-weight: 600; margin: 3px 0 6px; color: var(--a-d); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.chip { font-family: var(--disp); font-size: .72rem; padding: 4px 8px 1px; border: 2.5px solid var(--ink); border-radius: 10px; background: var(--cream); white-space: nowrap; }
.chip.hot { background: var(--mustard); }
.pinfo .bio { font-size: .8rem; line-height: 1.35; }
.parkstrip { position: relative; margin: 18px 0 0; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 5px 6px 0 var(--ink); transform: rotate(.8deg); }
.parkstrip canvas { display: block; }
.parkstrip .lab { position: absolute; left: 10px; top: 8px; background: var(--cream); border: 2.5px solid var(--ink); border-radius: 10px; padding: 4px 9px 1px; font-family: var(--disp); font-size: .82rem; transform: rotate(-3deg); box-shadow: 0 3px 0 var(--ink); }
.parkstrip .lab small { display: block; font-family: var(--body); font-weight: 600; font-size: .62rem; letter-spacing: .04em; text-transform: uppercase; }
.goal { margin-top: 20px; }
.goal .gtxt { font-size: 1rem; font-weight: 600; line-height: 1.35; }
.goal ul { list-style: none; margin: 10px 0 0; padding: 0; }
.goal li { display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: .88rem; font-weight: 600; }
.goal li .star { width: 24px; height: 24px; }
.note { margin-top: 14px; font-size: .8rem; font-weight: 600; padding: 10px 12px; border: 3px dashed var(--ink); border-radius: 14px; background: var(--c-ll); }
.note.plain { background: transparent; border-style: dotted; }

/* ---------- results */
.results .verdict { text-align: center; margin-top: 6px; position: relative; }
.vwrap { position: relative; display: inline-block; padding: 18px 26px; }
.vwrap::before { content: ""; position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px; z-index: -1; border-radius: 50%;
  background: repeating-conic-gradient(var(--c) 0 10deg, transparent 10deg 20deg); -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%); mask: radial-gradient(circle, #000 20%, transparent 68%); animation: spin 30s linear infinite; }
.vstamp { display: inline-block; font-family: var(--disp); font-size: clamp(54px, 18vw, 82px); line-height: 1; padding-top: 6px; color: var(--mustard);
  text-shadow: var(--ol3), 2px 2px 0 var(--ink), 3px 3px 0 var(--ink), 4px 4px 0 var(--ink), 5px 5px 0 var(--ink), 6px 7px 0 var(--ink);
  transform: rotate(-6deg); animation: boing .7s var(--pop) both .1s; }
.vstamp.lose { color: var(--teal); }
@keyframes boing { 0% { opacity: 0; transform: scale(.2) rotate(-25deg); } 55% { opacity: 1; transform: scale(1.18, .88) rotate(-4deg); } 75% { transform: scale(.94, 1.06) rotate(-7deg); } 100% { transform: scale(1) rotate(-6deg); } }
.results .head { font-family: var(--disp); font-size: 1.2rem; margin-top: 2px; color: var(--cream); text-shadow: var(--ol), 2px 3px 0 var(--ink); }
.results .score { font-size: 1.02rem; font-weight: 700; margin-top: 4px; }
.bigstars { display: flex; justify-content: center; gap: 12px; margin: 10px 0 4px; }
.bigstars > span { position: relative; display: block; }
.bigstars .star { width: 58px; height: 58px; display: block; }
.bigstars > span:nth-child(2) .star { width: 70px; height: 70px; margin-top: -10px; }
.bigstars .star.on { animation: starIn .55s var(--pop) both; }
@keyframes starIn { 0% { transform: scale(2.8) rotate(-40deg); opacity: 0; } 60% { opacity: 1; transform: scale(.85) rotate(8deg); } 100% { transform: none; } }
.confetti { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; z-index: 3; }
.confetti i { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; background: var(--k, var(--mustard)); border: 2px solid var(--ink); border-radius: 2px; animation: fly .9s cubic-bezier(.2,.7,.4,1) both; }
.confetti i.st { border: 0; width: 14px; height: 14px; left: -7px; top: -7px; background: var(--k); clip-path: polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); }
@keyframes fly { 0% { transform: translate(0,0) rotate(0) scale(.4); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1); opacity: 0; } }
.statline { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 10px 0 4px; }
.statline > span { font-family: var(--disp); font-size: .8rem; padding: 4px 9px 1px; border: 2.5px solid var(--ink); border-radius: 10px; background: var(--cream); }
.statline.txt > span { border: 0; background: none; font-family: var(--body); font-weight: 700; }
.tally { margin-top: 14px; }
.tally .ln { display: flex; justify-content: space-between; gap: 8px; font-size: .86rem; font-weight: 600; padding: 4px 0; border-bottom: 2.5px dotted color-mix(in srgb, var(--ink) 22%, transparent); animation: lnIn .3s var(--pop) both; }
.tally .ln span:last-child { white-space: nowrap; font-weight: 700; }
@keyframes lnIn { from { opacity: 0; transform: translateX(-16px) scale(.9); } }
.tally .totals { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.tally .ctot { font-family: var(--disp); font-size: 1.4rem; display: flex; align-items: center; gap: 6px; padding-top: 3px; }
.tally .lvwrap { flex: 1; display: flex; align-items: center; gap: 8px; }
.tally .bar { max-width: none; height: 16px; }
.lvup { font-family: var(--disp); color: var(--brick); animation: boing .6s var(--pop) both; display: inline-block; }
.achs { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.achrow { display: flex; align-items: center; gap: 12px; font-size: .84rem; animation: lnIn .35s var(--pop) both; }
.achrow b { font-family: var(--disp); font-weight: 400; font-size: .98rem; display: block; }
.unl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.unl .chip { font-size: .8rem; padding: 6px 10px 3px; background: var(--mustard); box-shadow: 0 3px 0 var(--ink); }
.countdown { text-align: center; font-size: .86rem; font-weight: 600; margin-top: 12px; }
.countdown b { font-family: var(--disp); font-weight: 400; font-size: 1.2rem; }

/* ---------- stamps (achievements as round stickers) */
.astamp { position: relative; width: 60px; height: 60px; flex: none; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; color: var(--ink); background: var(--mustard); font-family: var(--disp); font-size: 1rem; line-height: 1; padding-top: 3px; text-align: center; transform: rotate(-10deg); box-sizing: border-box; box-shadow: 0 4px 0 var(--ink); }
.astamp::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 2px dashed rgba(27,20,32,.45); }
.astamp.sm { width: 46px; height: 46px; font-size: .76rem; box-shadow: 0 3px 0 var(--ink); }
.astamp.off { color: color-mix(in srgb, var(--ink) 45%, transparent); background: transparent; border-style: dashed; border-color: color-mix(in srgb, var(--ink) 35%, transparent); box-shadow: none; transform: none; }
.astamp.off::before { display: none; }
.stampgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 6px; }
.stampgrid .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: .64rem; font-weight: 600; line-height: 1.15; min-height: 44px; }
.stampgrid .cell:nth-child(3n) .astamp:not(.off) { transform: rotate(8deg); background: var(--teal); }
.stampgrid .cell:nth-child(4n+2) .astamp:not(.off) { background: var(--b-l); }
.stampgrid .cell:nth-child(5n+1) .astamp:not(.off) { transform: rotate(-3deg); }

/* ---------- shop / pack */
.shopstage { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 10px; }
.packwrap { position: relative; filter: drop-shadow(6px 7px 0 var(--ink)); animation: hover 2.6s ease-in-out infinite; }
@keyframes hover { 50% { transform: translateY(-6px) rotate(1deg); } }
.pack {
  position: relative; width: 196px; height: 270px; transform: rotate(-4deg); background: var(--a); color: var(--cream); overflow: hidden; isolation: isolate;
  text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 6px;
  clip-path: polygon(0 3%, 4% 0, 8% 3%, 12% 0, 16% 3%, 20% 0, 24% 3%, 28% 0, 32% 3%, 36% 0, 40% 3%, 44% 0, 48% 3%, 52% 0, 56% 3%, 60% 0, 64% 3%, 68% 0, 72% 3%, 76% 0, 80% 3%, 84% 0, 88% 3%, 92% 0, 96% 3%, 100% 0, 100% 97%, 96% 100%, 92% 97%, 88% 100%, 84% 97%, 80% 100%, 76% 97%, 72% 100%, 68% 97%, 64% 100%, 60% 97%, 56% 100%, 52% 97%, 48% 100%, 44% 97%, 40% 100%, 36% 97%, 32% 100%, 28% 97%, 24% 100%, 20% 97%, 16% 100%, 12% 97%, 8% 100%, 4% 97%, 0 100%);
}
.pack::before { content: ""; position: absolute; left: -50%; top: -30%; width: 200%; aspect-ratio: 1; z-index: -1; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,244,220,.16) 0 10deg, transparent 10deg 20deg); }
.pack::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(transparent 0 11%, var(--b) 11% 15%, transparent 15% 85%, var(--b) 85% 89%, transparent 89%); }
.pack .pk1 { font-family: var(--disp); font-size: 1.62rem; line-height: .98; color: var(--mustard); text-shadow: var(--ol), 2px 3px 0 var(--ink); transform: rotate(-4deg); padding: 0 8px; }
.pack .pk2 { font-family: var(--disp); font-size: .84rem; letter-spacing: .06em; margin-top: 8px; background: var(--cream); color: var(--ink); padding: 5px 10px 2px; border: 2.5px solid var(--ink); border-radius: 8px; transform: rotate(2deg); }
.pack .pk3 { font-weight: 700; font-size: .74rem; margin-top: 6px; }
.pack .gum { width: 70px; height: 16px; margin-top: 10px; border: 2.5px solid var(--ink); border-radius: 4px; background: #F59AB8; transform: rotate(-3deg); box-shadow: inset 0 4px 0 rgba(255,255,255,.4); }
.packwrap .burst { position: absolute; z-index: 2; right: -34px; top: -22px; width: 76px; height: 76px; display: grid; place-items: center; text-align: center; font-family: var(--disp); font-size: .72rem; line-height: 1; color: var(--ink); transform: rotate(16deg); animation: wiggle 1.4s ease-in-out infinite; }
.packwrap .burst::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--ink); clip-path: polygon(50% 0, 61% 14%, 79% 9%, 79% 27%, 96% 34%, 86% 50%, 96% 66%, 79% 73%, 79% 91%, 61% 86%, 50% 100%, 39% 86%, 21% 91%, 21% 73%, 4% 66%, 14% 50%, 4% 34%, 21% 27%, 21% 9%, 39% 14%); }
.packwrap .burst::after { content: ""; position: absolute; inset: 5px; z-index: -1; background: var(--mustard); clip-path: polygon(50% 0, 61% 14%, 79% 9%, 79% 27%, 96% 34%, 86% 50%, 96% 66%, 79% 73%, 79% 91%, 61% 86%, 50% 100%, 39% 86%, 21% 91%, 21% 73%, 4% 66%, 14% 50%, 4% 34%, 21% 27%, 21% 9%, 39% 14%); }
.odds { font-size: .76rem; font-weight: 600; text-align: center; line-height: 1.5; max-width: 330px; }
.opening { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--navy); color: var(--cream); padding: calc(var(--sat) + 10px) 16px calc(var(--sab) + 14px); box-sizing: border-box; overflow: hidden; isolation: isolate; }
.opening::before { content: ""; position: absolute; left: 50%; top: 45%; width: 160vmax; height: 160vmax; margin: -80vmax 0 0 -80vmax; z-index: -1; background: repeating-conic-gradient(rgba(242,182,50,.16) 0 8deg, transparent 8deg 16deg); animation: spin 60s linear infinite; }
.opening .stamp { font-family: var(--disp); color: var(--cream); text-shadow: var(--ol), 2px 3px 0 var(--ink); }
.opening .small { color: var(--cream); }
.opening .rip { animation: ripTop .55s ease-in both; }
@keyframes ripTop { 0% { transform: none; } 30% { transform: translateY(-6px) rotate(-4deg); } 100% { transform: translate(80px, -300px) rotate(40deg); opacity: 0; } }
.opening .packlow { animation: packDrop .55s cubic-bezier(.5,-.4,.8,.6) both .45s; }
@keyframes packDrop { to { transform: translateY(460px) rotate(-12deg); opacity: 0; } }
.flip { position: relative; perspective: 900px; }
.flip .in { position: relative; transform-style: preserve-3d; transition: transform .55s var(--pop); }
.flip.shown .in { transform: rotateY(180deg); }
.flip .face { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.flip .face.front { transform: rotateY(180deg); }
.flip:not(.shown) { animation: hover 1.6s ease-in-out infinite; }
.cardback { width: 100%; height: 100%; box-sizing: border-box; background: var(--b); border: 3px solid var(--ink); border-radius: 7%/5%; display: grid; place-items: center; position: relative; overflow: hidden; isolation: isolate; box-shadow: inset 0 0 0 7px var(--cream), inset 0 0 0 10px var(--ink); }
.cardback::before { content: ""; position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; z-index: -1; background: repeating-conic-gradient(var(--c) 0 9deg, transparent 9deg 18deg); opacity: .6; }
.cardback span { position: relative; font-family: var(--disp); color: var(--mustard); text-shadow: var(--ol3), 3px 4px 0 var(--ink); font-size: 1.7rem; transform: rotate(-10deg); text-align: center; line-height: .95; }
.reveal-tag { min-height: 40px; text-align: center; }
.reveal-tag .t { display: inline-block; font-family: var(--disp); font-size: 1.2rem; padding: 6px 12px 2px; border: 3px solid var(--ink); border-radius: 12px; transform: rotate(-4deg); box-shadow: 0 3px 0 var(--ink); animation: boing .5s var(--pop) both; }
.reveal-tag .t.new { background: var(--brick); color: var(--cream); text-shadow: var(--ol); }
.reveal-tag .t.dupe { background: var(--cream); color: var(--ink); }
.reveal-tag .t.foil, .reveal-tag .t.rare { background: var(--mustard); color: var(--ink); }
.reveal-tag .t.misprint { background: var(--teal); color: var(--ink); }
.fanfare { position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px 0 0 -260px; z-index: -1; background: repeating-conic-gradient(var(--mustard) 0 9deg, transparent 9deg 18deg); border-radius: 50%; animation: spin 7s linear infinite; -webkit-mask: radial-gradient(circle, #000 20%, transparent 66%); mask: radial-gradient(circle, #000 20%, transparent 66%); }
.fanfare.misprint { background: repeating-conic-gradient(var(--teal) 0 8deg, var(--b) 8deg 16deg, transparent 16deg 24deg); }
.minis { display: flex; gap: 12px; justify-content: center; }
.minis .cslot .nm { color: var(--cream); }

/* ---------- album */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; margin-bottom: 10px; }
.tab { position: relative; min-height: 48px; border: 3px solid var(--ink); border-radius: 14px; font-family: var(--disp); font-size: .92rem; line-height: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 5px 2px 3px; background: var(--cream); box-shadow: 0 4px 0 var(--ink); transition: transform .3s var(--pop); }
.tab small { font-family: var(--body); font-weight: 600; font-size: .66rem; }
.tab:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.tab.on { background: var(--a); color: var(--cream); text-shadow: var(--ol); transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.tab.on small { text-shadow: none; }
.tab.done:not(.on) { background: var(--mustard); }
.tabs.two { grid-template-columns: 1fr 1fr; }
.teamhead { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
.teamhead .tn { font-family: var(--disp); font-size: 1.35rem; line-height: 1.05; color: var(--cream); text-shadow: var(--ol), 2px 3px 0 var(--ink); padding-top: 3px; }
.teamhead .sw { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 3px solid var(--ink); background: conic-gradient(var(--a) 0 120deg, var(--b) 0 240deg, var(--c) 0); }
.setnote { display: flex; align-items: center; gap: 12px; font-size: .8rem; font-weight: 600; margin: 8px 0 14px; padding: 10px 12px; border: 3px dashed var(--ink); border-radius: 16px; }
.setnote.done { border-style: solid; background: var(--c-l); }
.cgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; }
.cslot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.cslot canvas { filter: drop-shadow(3px 4px 0 var(--ink)); }
.cslot .nm { font-size: .66rem; font-weight: 600; text-align: center; line-height: 1.15; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cslot .cnt { position: absolute; top: -8px; right: -6px; background: var(--cream); color: var(--ink); font-family: var(--disp); font-size: .72rem; padding: 4px 6px 1px; border: 2.5px solid var(--ink); border-radius: 10px; transform: rotate(8deg); }
.cslot .mp { position: absolute; top: -8px; left: -6px; background: var(--teal); color: var(--ink); font-family: var(--disp); font-size: .62rem; padding: 4px 6px 1px; border: 2.5px solid var(--ink); border-radius: 10px; transform: rotate(-8deg); }
.empty { box-sizing: border-box; border: 3px dashed color-mix(in srgb, var(--ink) 40%, transparent); border-radius: 10px; display: grid; place-items: center; font-family: var(--disp); font-size: 1rem; color: color-mix(in srgb, var(--ink) 40%, transparent); background: repeating-linear-gradient(-45deg, transparent 0 8px, color-mix(in srgb, var(--ink) 5%, transparent) 8px 16px); }
.modal { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: calc(var(--sat) + 14px) 18px calc(var(--sab) + 14px); box-sizing: border-box; background: color-mix(in srgb, var(--navy) 82%, transparent); animation: fadeIn .2s both; }
.modal > :first-child { animation: popIn .45s var(--pop) both; }
.modal .info { text-align: center; max-width: 340px; background: var(--cream); border: 3px solid var(--ink); border-radius: 18px; padding: 10px 14px; box-shadow: 0 5px 0 var(--ink); }
.modal .info b { font-family: var(--disp); font-weight: 400; font-size: 1.3rem; display: block; padding-top: 3px; }
.modal .info p { margin: 4px 0; font-size: .8rem; line-height: 1.35; }

/* ---------- locker */
.item { position: relative; margin-bottom: 16px; padding: 12px 14px 14px; transition: transform .3s var(--pop); }
.item:active { transform: scale(.98); }
.item.eq { background: var(--c-ll); }
.item.eq::after { content: ""; position: absolute; inset: -3px; border-radius: 20px; border: 3px solid var(--ink); box-shadow: 0 0 0 4px var(--mustard); pointer-events: none; }
.item .ihead { display: flex; align-items: center; gap: 8px; }
.item .ihead b { font-family: var(--disp); font-weight: 400; font-size: 1.15rem; flex: 1; padding-top: 3px; }
.item .desc { font-size: .8rem; line-height: 1.32; margin: 6px 0 8px; }
.eqtag { font-family: var(--disp); font-size: .72rem; background: var(--grass); color: var(--cream); text-shadow: var(--ol); padding: 5px 8px 2px; border: 2.5px solid var(--ink); border-radius: 10px; transform: rotate(4deg); }
.newtag { font-family: var(--disp); font-size: .7rem; background: var(--brick); color: var(--cream); padding: 4px 7px 1px; border: 2.5px solid var(--ink); border-radius: 10px; transform: rotate(-6deg); animation: wiggle 1.5s infinite; }
.meters { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; align-items: center; font-family: var(--disp); font-size: .7rem; }
.meter { height: 12px; border: 2.5px solid var(--ink); border-radius: 8px; position: relative; overflow: hidden; background: var(--cream); }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--a); border-right: 2px solid var(--ink); }
.meter .mid { position: absolute; top: -2px; bottom: -2px; width: 0; border-left: 2.5px dotted var(--ink); }
.item.locked > *:not(.lockrow) { opacity: .5; }
.lockrow { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: .8rem; font-weight: 600; }
.lockrow .btn { width: auto; min-height: 44px; font-size: .9rem; padding: 6px 14px 4px; }
.igrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
.itile { padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 6px; margin: 0; }
.itile canvas, .itile .pstrip { border-radius: 12px; border: 2.5px solid var(--ink); box-sizing: border-box; }
.itile b { font-family: var(--disp); font-weight: 400; font-size: .95rem; line-height: 1.05; }
.itile .desc { font-size: .68rem; line-height: 1.25; margin: 0; }
.itile .lockrow { margin-top: 0; font-size: .66rem; }

/* ---------- scorebook */
.ledger { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; font-size: .86rem; font-weight: 600; }
.ledger span { padding: 6px 0; border-bottom: 2.5px dotted color-mix(in srgb, var(--ink) 20%, transparent); }
.ledger span:nth-child(2n) { text-align: right; font-family: var(--disp); font-weight: 400; padding-top: 8px; }
