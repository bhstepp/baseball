name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack models
        # compresses raw models (assets/src, or models exported in place) with gltfpack and checks them; models that
        # are already packed are skipped. If it fails, the build ships what is in assets/ as it is.
        run: node tools/pack-assets.js || echo "pack-assets failed; shipping the models as they are"
      - name: Build
        # writes dist/site: index.html, sw.js, manifest, icons and assets/*.glb (models fetched on demand)
        run: node tools/build.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
